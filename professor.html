<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1565c0" />
  <title>Área do Professor · Frei Graciano Droessler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       Reset & Tokens
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white:          #ffffff;
      --white-soft:     #f7fbfe;

      --azul-bebe-50:   #eaf5fb;
      --azul-bebe-100:  #d3ecf8;
      --azul-bebe-200:  #b8e0f5;
      --azul-bebe-300:  #8ecbee;

      --azul-escuro:    #1565c0;
      --azul-escuro-2:  #0d47a1;

      --ink:            #0f1e35;
      --ink-soft:       #475569;
      --ink-mute:       #94a3b8;

      --danger:         #dc2626;

      --shadow-sm: 0 1px 2px rgba(15, 30, 53, 0.06);
      --shadow-md: 0 10px 30px -10px rgba(21, 101, 192, 0.18);
      --shadow-lg: 0 30px 60px -20px rgba(21, 101, 192, 0.25);
      --ring: 0 0 0 4px rgba(184, 224, 245, 0.55);

      --radius-card: 28px;
      --radius-pill: 14px;

      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-display: 'Playfair Display', Georgia, serif;
    }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      font-family: var(--font-sans);
      font-size: 16px;
      color: var(--ink);
      background-color: var(--white-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================================================
       Fundo decorativo
       ========================================================= */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background:
        radial-gradient(1200px 600px at 15% 10%, #ffffff 0%, transparent 60%),
        radial-gradient(900px 500px at 85% 90%, var(--azul-bebe-50) 0%, transparent 55%),
        linear-gradient(160deg, #ffffff 0%, var(--azul-bebe-50) 55%, #eaf5fb 100%);
    }

    .bg-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      pointer-events: none;
    }
    .bg-glow-1 {
      width: 480px; height: 480px;
      top: -160px; left: -140px;
      background: radial-gradient(circle, var(--azul-bebe-200) 0%, transparent 70%);
      animation: float 14s ease-in-out infinite;
    }
    .bg-glow-2 {
      width: 560px; height: 560px;
      bottom: -220px; right: -160px;
      background: radial-gradient(circle, var(--azul-bebe-100) 0%, transparent 70%);
      animation: float 18s ease-in-out infinite reverse;
    }
    .bg-grain {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(21, 101, 192, 0.05) 1px, transparent 1px);
      background-size: 22px 22px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
      opacity: 0.6;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(20px, -20px) scale(1.05); }
    }

    /* =========================================================
       Voltar
       ========================================================= */
    .back-link {
      position: fixed;
      top: 20px;
      left: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--azul-bebe-100);
      border-radius: 999px;
      color: var(--azul-escuro);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
      z-index: 10;
    }
    .back-link:hover {
      transform: translateX(-3px);
      background: var(--white);
      border-color: var(--azul-bebe-200);
      box-shadow: var(--shadow-md);
    }
    .back-link svg { width: 16px; height: 16px; }

    /* =========================================================
       Cartão de login
       ========================================================= */
    .login-card {
      position: relative;
      width: 100%;
      max-width: 460px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-card);
      padding: 40px 36px 32px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 26px;
      animation: card-in 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .login-card::before {
      content: "";
      position: absolute;
      top: 0; left: 12%; right: 12%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--azul-escuro), transparent);
      border-radius: 0 0 4px 4px;
      opacity: 0.75;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* =========================================================
       Cabeçalho interno
       ========================================================= */
    .card-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: linear-gradient(135deg, var(--azul-bebe-50), var(--azul-bebe-100));
      border: 1px solid var(--azul-bebe-100);
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--azul-escuro);
    }
    .badge svg { width: 14px; height: 14px; }

    .card-title {
      font-family: var(--font-display);
      font-size: clamp(1.45rem, 3.4vw, 1.85rem);
      font-weight: 700;
      color: var(--ink);
      line-height: 1.2;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, var(--ink) 0%, var(--azul-escuro-2) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card-subtitle {
      font-size: 0.88rem;
      color: var(--ink-soft);
      max-width: 340px;
      line-height: 1.5;
    }

    /* =========================================================
       Formulário
       ========================================================= */
    .form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: 0.01em;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap svg.input-icon {
      position: absolute;
      left: 16px;
      width: 18px;
      height: 18px;
      color: var(--ink-mute);
      pointer-events: none;
      transition: color 0.3s ease;
    }

    .field input {
      width: 100%;
      padding: 14px 16px 14px 46px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--ink);
      background: var(--white);
      border: 1.5px solid var(--azul-bebe-100);
      border-radius: var(--radius-pill);
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }
    .field input::placeholder { color: var(--ink-mute); }

    .field input:focus {
      border-color: var(--azul-escuro);
      box-shadow: var(--ring);
      background: var(--white);
    }
    .input-wrap:focus-within svg.input-icon {
      color: var(--azul-escuro);
    }

    /* botão de mostrar senha */
    .toggle-pass {
      position: absolute;
      right: 12px;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      background: transparent;
      border: none;
      border-radius: 50%;
      color: var(--ink-mute);
      cursor: pointer;
      transition: color 0.25s ease, background 0.25s ease;
    }
    .toggle-pass:hover {
      color: var(--azul-escuro);
      background: var(--azul-bebe-50);
    }
    .toggle-pass svg { width: 18px; height: 18px; }

    /* linha de opções */
    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.85rem;
    }
    .form-row label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink-soft);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .form-row input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: var(--azul-escuro);
      cursor: pointer;
    }
    .form-row a {
      color: var(--azul-escuro);
      font-weight: 600;
      text-decoration: none;
      transition: color 0.25s ease;
    }
    .form-row a:hover { color: var(--azul-escuro-2); text-decoration: underline; }

    /* botão principal */
    .btn-primary {
      width: 100%;
      padding: 15px 20px;
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--white);
      background: linear-gradient(135deg, var(--azul-escuro), var(--azul-escuro-2));
      border: none;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.3s ease, filter 0.25s ease;
      box-shadow: 0 10px 24px -8px rgba(21, 101, 192, 0.55);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -8px rgba(21, 101, 192, 0.65);
      filter: brightness(1.05);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:focus-visible { outline: none; box-shadow: var(--ring), 0 10px 24px -8px rgba(21, 101, 192, 0.55); }
    .btn-primary svg { width: 18px; height: 18px; }

    /* erro */
    .error-msg {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      color: var(--danger);
      font-size: 0.82rem;
      font-weight: 500;
      animation: shake 0.35s ease;
    }
    .error-msg.show { display: flex; }
    .error-msg svg { width: 16px; height: 16px; flex-shrink: 0; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }

    /* rodapé */
    .card-footer {
      text-align: center;
      font-size: 0.78rem;
      color: var(--ink-soft);
      border-top: 1px solid var(--azul-bebe-100);
      padding-top: 16px;
    }
    .card-footer strong { color: var(--azul-escuro); }

    /* =========================================================
       Responsivo
       ========================================================= */
    @media (max-width: 540px) {
      body { padding: 70px 14px 20px; align-items: flex-start; }

      .back-link { top: 14px; left: 14px; padding: 8px 14px; font-size: 0.78rem; }

      .login-card { padding: 32px 22px 24px; border-radius: 20px; gap: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Fundo -->
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-grain"></div>
  </div>

  <!-- Botão voltar → 1.html -->
  <a href="1.html" class="back-link" aria-label="Voltar para a tela inicial">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"/>
      <path d="M12 19l-7-7 7-7"/>
    </svg>
    Voltar
  </a>

  <!-- =========================================================
       LOGIN
       ========================================================= -->
  <main class="login-card" role="main">

    <header class="card-header">
      <span class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4h20v12H2z"/>
          <path d="M12 16v5"/>
          <path d="M8 21h8"/>
        </svg>
        Acesso Docente
      </span>

      <h1 class="card-title">Área do Professor</h1>
      <p class="card-subtitle">
        Entre com suas credenciais docentes para acessar o painel do professor.
      </p>
    </header>

    <form class="form" id="login-form" novalidate>

      <!-- erro -->
      <div class="error-msg" id="error-msg" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 8v4"/>
          <path d="M12 16h.01"/>
        </svg>
        <span id="error-text">Preencha todos os campos.</span>
      </div>

      <!-- usuário -->
      <div class="field">
        <label for="user">Usuário ou e-mail</label>
        <div class="input-wrap">
          <input type="text" id="user" name="user" placeholder="ex: professor" autocomplete="username" required />
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
      </div>

      <!-- senha -->
      <div class="field">
        <label for="pass">Senha</label>
        <div class="input-wrap">
          <input type="password" id="pass" name="pass" placeholder="Digite sua senha" autocomplete="current-password" required />
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="11" width="16" height="10" rx="2"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
          <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Mostrar senha">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- opções -->
      <div class="form-row">
        <label>
          <input type="checkbox" id="remember" />
          Lembrar de mim
        </label>
        <a href="#" onclick="alert('Entre em contato com a secretaria da escola.'); return false;">Esqueci a senha</a>
      </div>

      <!-- botão entrar -->
      <button type="submit" class="btn-primary" id="btn-login">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <path d="M10 17l5-5-5-5"/>
          <path d="M15 12H3"/>
        </svg>
        Entrar
      </button>
    </form>

    <footer class="card-footer">
      Acesso restrito ao docente · <strong>Frei Graciano Droessler</strong>
    </footer>

  </main>

  <!-- =========================================================
       JavaScript
       ========================================================= -->
  <script>
    /* ---------- Elementos ---------- */
    const loginForm  = document.getElementById('login-form');
    const errorBox   = document.getElementById('error-msg');
    const errorText  = document.getElementById('error-text');
    const userInput  = document.getElementById('user');
    const passInput  = document.getElementById('pass');
    const togglePass = document.getElementById('toggle-pass');
    const remember   = document.getElementById('remember');

    /* ---------- Mostrar / esconder senha ---------- */
    togglePass.addEventListener('click', () => {
      const isPass = passInput.type === 'password';
      passInput.type = isPass ? 'text' : 'password';
      togglePass.setAttribute('aria-label', isPass ? 'Ocultar senha' : 'Mostrar senha');
      togglePass.innerHTML = isPass
        ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
             <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
             <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
             <line x1="1" y1="1" x2="23" y2="23"/>
           </svg>`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
             <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
             <circle cx="12" cy="12" r="3"/>
           </svg>`;
    });

    /* ---------- Erro ---------- */
    function showError(msg) {
      errorText.textContent = msg;
      errorBox.classList.add('show');
      errorBox.style.animation = 'none';
      void errorBox.offsetWidth;
      errorBox.style.animation = '';
    }
    function hideError() {
      errorBox.classList.remove('show');
    }

    /* ---------- Login → redireciona para 2.html ---------- */
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      hideError();

      const user = userInput.value.trim();
      const pass = passInput.value.trim();

      if (!user || !pass) {
        showError('Preencha usuário e senha para continuar.');
        return;
      }
      if (pass.length < 4) {
        showError('A senha deve ter pelo menos 4 caracteres.');
        return;
      }

      /* 
        ⚠️ Aqui é onde você vai plugar o backend depois.
        Por enquanto: qualquer usuário + senha (>=4 chars) entra.
      */

      // Guarda o nome do usuário logado para usar no 2.html
      const display = user
        .replace(/[._-]+/g, ' ')
        .replace(/\b\w/g, l => l.toUpperCase());

      sessionStorage.setItem('professorLogado', display);

      // Se marcou "Lembrar de mim", salva também no localStorage
      if (remember.checked) {
        localStorage.setItem('professorLembrado', user);
      } else {
        localStorage.removeItem('professorLembrado');
      }

      // 🔀 Redireciona para o painel
      window.location.href = '2.html';
    });

    /* ---------- Preenche usuário se estava "lembrado" ---------- */
    const lembrado = localStorage.getItem('professorLembrado');
    if (lembrado) {
      userInput.value = lembrado;
      remember.checked = true;
      passInput.focus();
    } else {
      userInput.focus();
    }
  </script>

</body>
</html>
