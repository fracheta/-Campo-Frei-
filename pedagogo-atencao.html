<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1565c0" />
  <title>Atenção · Pedagogo · Frei Graciano Droessler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --white:#fff; --white-soft:#f7fbfe;
      --azul-bebe-50:#eaf5fb; --azul-bebe-100:#d3ecf8; --azul-bebe-200:#b8e0f5; --azul-bebe-300:#8ecbee;
      --azul-escuro:#1565c0; --azul-escuro-2:#0d47a1;
      --ink:#0f1e35; --ink-soft:#475569; --ink-mute:#94a3b8;
      --verde:#22c55e; --verde-2:#15803d; --amarelo:#f59e0b; --amarelo-2:#b45309;
      --vermelho:#dc2626; --roxo:#8b5cf6; --roxo-2:#6d28d9; --ciano:#06b6d4; --rosa:#ec4899;
      --shadow-sm:0 1px 2px rgba(15,30,53,.06); --shadow-md:0 10px 30px -10px rgba(21,101,192,.18);
      --shadow-lg:0 30px 60px -20px rgba(21,101,192,.25);
      --radius:22px;
      --font-sans:'Inter',system-ui,sans-serif;
      --font-display:'Playfair Display',Georgia,serif;
    }
    html { scroll-behavior: smooth; }
    body { min-height:100vh;font-family:var(--font-sans);font-size:16px;color:var(--ink);background-color:var(--white-soft);padding:32px 20px 60px;overflow-x:hidden;position:relative;-webkit-font-smoothing:antialiased; }
    .bg-layer { position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1200px 600px at 15% 10%,#fff 0%,transparent 60%),radial-gradient(900px 500px at 85% 90%,var(--azul-bebe-50) 0%,transparent 55%),linear-gradient(160deg,#fff 0%,var(--azul-bebe-50) 55%,#eaf5fb 100%); }
    .bg-glow { position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;pointer-events:none; }
    .bg-glow-1 { width:480px;height:480px;top:-160px;left:-140px;background:radial-gradient(circle,var(--azul-bebe-200) 0%,transparent 70%);animation:float 14s ease-in-out infinite; }
    .bg-glow-2 { width:560px;height:560px;bottom:-220px;right:-160px;background:radial-gradient(circle,var(--azul-bebe-100) 0%,transparent 70%);animation:float 18s ease-in-out infinite reverse; }
    .bg-grain { position:absolute;inset:0;background-image:radial-gradient(rgba(21,101,192,.05) 1px,transparent 1px);background-size:22px 22px;mask-image:radial-gradient(circle at center,black 40%,transparent 80%);-webkit-mask-image:radial-gradient(circle at center,black 40%,transparent 80%);opacity:.6; }
    @keyframes float { 0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(20px,-20px) scale(1.05);} }
    .container { width:100%;max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px;animation:fade-in .7s cubic-bezier(.22,1,.36,1); }
    @keyframes fade-in { from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);} }
    .topbar { display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 22px;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.9);border-radius:var(--radius);box-shadow:var(--shadow-md); }
    .brand { display:flex;align-items:center;gap:14px;min-width:0; }
    .brand-logo { width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--amarelo),var(--amarelo-2));color:#fff;font-family:var(--font-display);font-weight:700;font-size:1.1rem;flex-shrink:0;box-shadow:0 8px 20px -6px rgba(245,158,11,.5); }
    .brand-info .top { font-size:.66rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--amarelo-2);opacity:.85; }
    .brand-info .main { font-size:.92rem;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .topbar-actions { display:flex;align-items:center;gap:10px; }
    .user-chip { display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;background:var(--azul-bebe-50);border:1px solid var(--azul-bebe-100);border-radius:999px; }
    .user-chip .avatar { width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--roxo),var(--roxo-2));color:#fff;font-size:.85rem;font-weight:700;position:relative; }
    .user-chip .avatar::after { content:"";position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;border-radius:50%;background:var(--verde);border:2px solid #fff; }
    .user-chip .name { font-size:.85rem;font-weight:600;color:var(--ink);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .btn-top { display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:var(--white);border:1px solid var(--azul-bebe-100);border-radius:999px;color:var(--azul-escuro);font-family:inherit;font-size:.82rem;font-weight:600;cursor:pointer;text-decoration:none;transition:all .3s ease;white-space:nowrap; }
    .btn-top:hover { background:var(--azul-escuro);color:#fff;border-color:var(--azul-escuro);transform:translateX(-3px); }
    .btn-top svg { width:15px;height:15px; }
    .hero { padding:28px 32px;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(254,243,199,.6));backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.9);border-radius:var(--radius);box-shadow:var(--shadow-md);position:relative;overflow:hidden; }
    .hero::before { content:"";position:absolute;top:-50%;right:-10%;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.15),transparent 70%);pointer-events:none; }
    .hero-content { position:relative;z-index:1; }
    .hero .eyebrow { font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--amarelo-2);margin-bottom:6px;display:inline-flex;align-items:center;gap:8px; }
    .hero .eyebrow::before { content:"";width:6px;height:6px;border-radius:50%;background:var(--amarelo);box-shadow:0 0 0 4px rgba(245,158,11,.2); }
    .hero h1 { font-family:var(--font-display);font-size:clamp(1.5rem,3.5vw,2rem);font-weight:700;line-height:1.15;color:var(--ink);margin-bottom:6px;letter-spacing:-.01em; }
    .hero p { font-size:.92rem;color:var(--ink-soft);max-width:560px;line-height:1.5; }
    .resumo { display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px; }
    .resumo-card { padding:16px 18px;background:rgba(255,255,255,.95);border:1px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:12px;position:relative;overflow:hidden; }
    .resumo-card::after { content:"";position:absolute;top:0;left:0;width:4px;height:100%; }
    .resumo-card.red::after { background:linear-gradient(180deg,var(--vermelho),#991b1b); }
    .resumo-card.amber::after { background:linear-gradient(180deg,var(--amarelo),var(--amarelo-2)); }
    .resumo-card.blue::after { background:linear-gradient(180deg,var(--azul-escuro),var(--azul-escuro-2)); }
    .resumo-icon { width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:#fff;flex-shrink:0; }
    .resumo-icon svg { width:20px;height:20px; }
    .resumo-icon.red { background:linear-gradient(135deg,#dc2626,#991b1b); }
    .resumo-icon.amber { background:linear-gradient(135deg,#f59e0b,#b45309); }
    .resumo-icon.blue { background:linear-gradient(135deg,#1565c0,#0d47a1); }
    .resumo-text { display:flex;flex-direction:column;gap:2px;min-width:0; }
    .resumo-value { font-family:var(--font-display);font-size:1.4rem;font-weight:700;color:var(--ink);line-height:1; }
    .resumo-label { font-size:.7rem;color:var(--ink-soft);font-weight:600;letter-spacing:.04em;text-transform:uppercase; }
    .alertas-list { display:flex;flex-direction:column;gap:10px; }
    .alerta { display:flex;align-items:center;gap:14px;padding:16px;background:rgba(255,255,255,.95);border-left:4px solid var(--amarelo);border-radius:14px;box-shadow:var(--shadow-sm);text-decoration:none;color:inherit;transition:all .25s ease; }
    .alerta.danger { border-left-color:var(--vermelho); }
    .alerta.amber { border-left-color:var(--amarelo); }
    .alerta.blue { border-left-color:var(--azul-escuro); }
    .alerta:hover { transform:translateX(4px);box-shadow:var(--shadow-md); }
    .alerta-icon { width:44px;height:44px;border-radius:11px;display:grid;place-items:center;color:#fff;flex-shrink:0; }
    .alerta-icon svg { width:20px;height:20px; }
    .alerta-icon.danger { background:linear-gradient(135deg,#dc2626,#991b1b); }
    .alerta-icon.amber { background:linear-gradient(135deg,#f59e0b,#b45309); }
    .alerta-icon.blue { background:linear-gradient(135deg,#1565c0,#0d47a1); }
    .alerta-info { flex:1;min-width:0; }
    .alerta-titulo { font-size:.92rem;font-weight:600;color:var(--ink); }
    .alerta-meta { font-size:.75rem;color:var(--ink-soft);margin-top:3px; }
    .alerta-badge { padding:5px 12px;border-radius:999px;font-size:.7rem;font-weight:700;flex-shrink:0; }
    .alerta-badge.danger { background:#fee2e2;color:#b91c1c; }
    .alerta-badge.amber { background:#fef3c7;color:#b45309; }
    .alerta-badge.blue { background:#dbeafe;color:#1d4ed8; }
    .empty-box { text-align:center;padding:70px 24px;color:var(--ink-soft);background:rgba(255,255,255,.7);border:1.5px dashed var(--azul-bebe-200);border-radius:20px; }
    .empty-box svg { width:56px;height:56px;color:var(--verde);margin-bottom:14px; }
    .empty-box h3 { font-family:var(--font-display);font-size:1.2rem;color:var(--ink);margin-bottom:4px; }
    .footer { margin-top:12px;display:flex;align-items:center;justify-content:center;gap:10px;padding:20px 24px;background:rgba(255,255,255,.6);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:var(--shadow-sm); }
    .footer .dot { width:6px;height:6px;border-radius:50%;background:var(--azul-escuro);opacity:.6; }
    .footer p { font-size:.76rem;color:var(--ink-soft); }
    @media (max-width:640px) {
      body { padding:20px 14px 40px; }
      .topbar { padding:14px 16px; }
      .btn-top span { display:none; }
      .user-chip .name { max-width:100px; }
      .hero { padding:22px 20px; }
      .resumo { grid-template-columns:1fr; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important;transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"><div class="bg-glow bg-glow-1"></div><div class="bg-glow bg-glow-2"></div><div class="bg-grain"></div></div>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">FG</div>
        <div class="brand-info">
          <div class="top">Área Pedagógica</div>
          <div class="main">Frei Graciano Droessler</div>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="user-chip">
          <div class="avatar" id="user-avatar">P</div>
          <span class="name" id="user-name">Pedagogo(a)</span>
        </div>
        <a href="3.html" class="btn-top" title="Voltar ao painel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
          <span>Painel</span>
        </a>
      </div>
    </header>

    <section class="hero">
      <div class="hero-content">
        <div class="eyebrow">Monitoramento</div>
        <h1>Situações que precisam de atenção</h1>
        <p>Alunos e turmas com frequência baixa, média em risco ou conselho pendente.</p>
      </div>
    </section>

    <section class="resumo" id="resumo"></section>

    <section class="alertas-list" id="alertas"></section>

    <footer class="footer"><span class="dot"></span><p>© 2025 · Escola Estadual do Campo Frei Graciano Droessler</p></footer>
  </div>

  <script>
    const nomePedagogo = sessionStorage.getItem('pedagogoLogado');
    if (!nomePedagogo) window.location.href = '2.html';
    document.getElementById('user-name').textContent = nomePedagogo || 'Pedagogo';
    document.getElementById('user-avatar').textContent = (nomePedagogo || 'P').trim().charAt(0).toUpperCase();

    const turmas = [
      { id:'6a', nome:'6º Ano A', media:7.6, freq:93, prof:'Mariana Alves', conselho:true },
      { id:'6b', nome:'6º Ano B', media:7.2, freq:89, prof:'Rafael Costa', conselho:true },
      { id:'7a', nome:'7º Ano A', media:8.1, freq:94, prof:'Mariana Alves', conselho:true },
      { id:'7b', nome:'7º Ano B', media:6.8, freq:82, prof:'Rafael Costa', conselho:false },
      { id:'8a', nome:'8º Ano A', media:7.9, freq:95, prof:'Mariana Alves', conselho:true },
      { id:'8b', nome:'8º Ano B', media:6.5, freq:79, prof:'Rafael Costa', conselho:false },
      { id:'9a', nome:'9º Ano A', media:8.3, freq:96, prof:'Mariana Alves', conselho:true },
      { id:'9b', nome:'9º Ano B', media:7.4, freq:87, prof:'Rafael Costa', conselho:true }
    ];

    // Gera alertas
    const alertas = [];
    turmas.forEach(t => {
      if (t.freq < 88) {
        alertas.push({
          tipo: t.freq < 80 ? 'danger' : 'amber',
          titulo: t.nome,
          meta: `Frequência em ${t.freq}% · professor(a) ${t.prof}`,
          badge: t.freq < 80 ? 'Crítico' : 'Atenção',
          turmaId: t.id,
          categoria: 'frequencia'
        });
      }
      if (t.media < 7) {
        alertas.push({
          tipo: t.media < 6 ? 'danger' : 'amber',
          titulo: t.nome,
          meta: `Média geral em ${t.media.toFixed(1)} · professor(a) ${t.prof}`,
          badge: t.media < 6 ? 'Risco' : 'Abaixo da meta',
          turmaId: t.id,
          categoria: 'media'
        });
      }
      if (!t.conselho) {
        alertas.push({
          tipo: 'blue',
          titulo: t.nome,
          meta: 'Conselho de classe ainda não registrado',
          badge: 'Pendente',
          turmaId: t.id,
          categoria: 'conselho'
        });
      }
    });

    const criticos = alertas.filter(a => a.tipo === 'danger').length;
    const atencao = alertas.filter(a => a.tipo === 'amber').length;
    const pendentes =
