<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1565c0" />
  <title>Nova Turma · Frei Graciano Droessler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #ffffff; --white-soft: #f7fbfe;
      --azul-bebe-50: #eaf5fb; --azul-bebe-100: #d3ecf8;
      --azul-bebe-200: #b8e0f5; --azul-bebe-300: #8ecbee;
      --azul-escuro: #1565c0; --azul-escuro-2: #0d47a1;
      --ink: #0f1e35; --ink-soft: #475569; --ink-mute: #94a3b8;
      --verde: #22c55e; --amarelo: #f59e0b; --vermelho: #dc2626;
      --shadow-sm: 0 1px 2px rgba(15, 30, 53, 0.06);
      --shadow-md: 0 10px 30px -10px rgba(21, 101, 192, 0.18);
      --shadow-lg: 0 30px 60px -20px rgba(21, 101, 192, 0.25);
      --ring: 0 0 0 4px rgba(184, 224, 245, 0.55);
      --radius-card: 24px;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-display: 'Playfair Display', Georgia, serif;
    }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      font-family: var(--font-sans);
      font-size: 16px;
      color: var(--ink);
      background-color: var(--white-soft);
      padding: 32px 20px 60px;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    .bg-layer { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: radial-gradient(1200px 600px at 15% 10%, #ffffff 0%, transparent 60%), radial-gradient(900px 500px at 85% 90%, var(--azul-bebe-50) 0%, transparent 55%), linear-gradient(160deg, #ffffff 0%, var(--azul-bebe-50) 55%, #eaf5fb 100%); }
    .bg-glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55; pointer-events: none; }
    .bg-glow-1 { width: 480px; height: 480px; top: -160px; left: -140px; background: radial-gradient(circle, var(--azul-bebe-200) 0%, transparent 70%); animation: float 14s ease-in-out infinite; }
    .bg-glow-2 { width: 560px; height: 560px; bottom: -220px; right: -160px; background: radial-gradient(circle, var(--azul-bebe-100) 0%, transparent 70%); animation: float 18s ease-in-out infinite reverse; }
    .bg-grain { position: absolute; inset: 0; background-image: radial-gradient(rgba(21, 101, 192, 0.05) 1px, transparent 1px); background-size: 22px 22px; mask-image: radial-gradient(circle at center, black 40%, transparent 80%); -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%); opacity: 0.6; }
    @keyframes float { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(20px, -20px) scale(1.05); } }

    .container {
      width: 100%; max-width: 900px; margin: 0 auto;
      display: flex; flex-direction: column; gap: 24px;
      animation: fade-in 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes fade-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap; padding: 18px 24px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-card); box-shadow: var(--shadow-md);
    }
    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .brand-logo {
      width: 46px; height: 46px; border-radius: 12px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--azul-escuro), var(--azul-escuro-2));
      color: var(--white); font-family: var(--font-display);
      font-weight: 700; font-size: 1.15rem; flex-shrink: 0;
      box-shadow: 0 8px 20px -6px rgba(21, 101, 192, 0.55);
    }
    .brand-info .top { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--azul-escuro); opacity: 0.85; }
    .brand-info .main { font-size: 0.95rem; font-weight: 700; color: var(--ink); }
    .btn-back {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 16px; background: var(--white);
      border: 1px solid var(--azul-bebe-100); border-radius: 999px;
      color: var(--azul-escuro); font-family: inherit;
      font-size: 0.82rem; font-weight: 600; cursor: pointer;
      text-decoration: none; transition: all 0.3s ease;
    }
    .btn-back:hover { background: var(--azul-escuro); color: var(--white); border-color: var(--azul-escuro); transform: translateX(-3px); }
    .btn-back svg { width: 15px; height: 15px; }

    .page-head {
      padding: 32px; background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(234,245,251,0.85));
      backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-card); box-shadow: var(--shadow-md);
      display: flex; align-items: center; gap: 20px;
    }
    .page-head-icon {
      width: 60px; height: 60px; border-radius: 16px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--azul-escuro), var(--azul-escuro-2));
      color: var(--white); flex-shrink: 0;
      box-shadow: 0 10px 24px -8px rgba(21, 101, 192, 0.55);
    }
    .page-head-icon svg { width: 30px; height: 30px; }
    .page-head-text .eyebrow { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--azul-escuro); margin-bottom: 4px; }
    .page-head-text h1 { font-family: var(--font-display); font-size: clamp(1.4rem, 3.5vw, 1.9rem); font-weight: 700; line-height: 1.15; color: var(--ink); margin-bottom: 4px; }
    .page-head-text p { font-size: 0.88rem; color: var(--ink-soft); }

    .card {
      padding: 32px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      box-shadow: var(--shadow-sm);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    .field-full { grid-column: 1 / -1; }
    .field { display: flex; flex-direction: column; gap: 8px; }
    .field label { font-size: 0.82rem; font-weight: 600; color: var(--ink); letter-spacing: 0.01em; }
    .field label .req { color: var(--vermelho); }
    .field input, .field select, .field textarea {
      width: 100%; padding: 13px 16px;
      font-family: inherit; font-size: 0.94rem;
      color: var(--ink);
      background: var(--white);
      border: 1.5px solid var(--azul-bebe-100);
      border-radius: 14px;
      outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .field textarea { min-height: 100px; resize: vertical; }
    .field input::placeholder, .field textarea::placeholder { color: var(--ink-mute); }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--azul-escuro);
      box-shadow: var(--ring);
    }
    .field .hint { font-size: 0.75rem; color: var(--ink-soft); }

    .dias-semana {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .dia {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 16px;
      background: var(--white);
      border: 1.5px solid var(--azul-bebe-100);
      border-radius: 999px;
      font-size: 0.82rem; font-weight: 600;
      color: var(--ink-soft);
      cursor: pointer;
      user-select: none;
      transition: all 0.25s ease;
    }
    .dia input { display: none; }
    .dia:hover { border-color: var(--azul-bebe-300); color: var(--azul-escuro); }
    .dia:has(input:checked) {
      background: var(--azul-escuro);
      color: var(--white);
      border-color: var(--azul-escuro);
    }

    .form-actions {
      display: flex; justify-content: flex-end; gap: 12px;
      margin-top: 8px; padding-top: 24px;
      border-top: 1px solid var(--azul-bebe-100);
    }
    .btn-primary, .btn-secondary {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 24px; border-radius: 999px;
      font-family: inherit; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; text-decoration: none;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--azul-escuro), var(--azul-escuro-2));
      color: var(--white); border: none;
      box-shadow: 0 10px 24px -8px rgba(21, 101, 192, 0.55);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -8px rgba(21, 101, 192, 0.65); }
    .btn-primary svg { width: 16px; height: 16px; }
    .btn-secondary {
      background: var(--white);
      border: 1.5px solid var(--azul-bebe-200);
      color: var(--azul-escuro);
    }
    .btn-secondary:hover { background: var(--azul-bebe-50); border-color: var(--azul-bebe-300); }

    .footer {
      margin-top: 12px; display: flex; align-items: center; justify-content: center;
      gap: 10px; padding: 20px 24px;
      background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 18px;
      box-shadow: var(--shadow-sm);
    }
    .footer .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--azul-escuro); opacity: 0.6; }
    .footer p { font-size: 0.76rem; color: var(--ink-soft); text-align: center; }

    @media (max-width: 640px) {
      body { padding: 20px 14px 40px; }
      .topbar { padding: 14px 16px; }
      .page-head { padding: 24px 20px; flex-direction: column; align-items: flex-start; }
      .card { padding: 22px; }
      .form-grid { grid-template-columns: 1fr; gap: 16px; }
      .form-actions { flex-direction: column-reverse; }
      .form-actions a, .form-actions button { width: 100%; justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="bg-layer" aria-hidden="true">
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-grain"></div>
  </div>

  <div class="container">

    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">FG</div>
        <div class="brand-info">
          <div class="top">Painel Docente</div>
          <div class="main">Frei Graciano Droessler</div>
        </div>
      </div>
      <a href="turmas.html" class="btn-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"/>
          <path d="M12 19l-7-7 7-7"/>
        </svg>
        Voltar às Turmas
      </a>
    </header>

    <section class="page-head">
      <div class="page-head-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </div>
      <div class="page-head-text">
        <div class="eyebrow">Gestão de Turmas</div>
        <h1>Nova Turma</h1>
        <p>Preencha as informações abaixo para criar uma nova turma.</p>
      </div>
    </section>

    <form class="card" id="form-nova-turma">

      <div class="form-grid">

        <div class="field">
          <label for="serie">Série / Ano <span class="req">*</span></label>
          <input type="text" id="serie" placeholder="ex: 9º Ano A" required />
        </div>

        <div class="field">
          <label for="materia">Matéria <span class="req">*</span></label>
          <select id="materia" required>
            <option value="">Selecione a matéria</option>
            <option>Matemática</option>
            <option>Português</option>
            <option>História</option>
            <option>Geografia</option>
            <option>Ciências</option>
            <option>Biologia</option>
            <option>Física</option>
            <option>Química</option>
            <option>Inglês</option>
            <option>Educação Física</option>
            <option>Artes</option>
          </select>
        </div>

        <div class="field">
          <label for="turno">Turno <span class="req">*</span></label>
          <select id="turno" required>
            <option value="">Selecione o turno</option>
            <option value="manha">Manhã</option>
            <option value="tarde">Tarde</option>
            <option value="noite">Noite</option>
          </select>
        </div>

        <div class="field">
          <label for="sala">Sala</label>
          <input type="text" id="sala" placeholder="ex: Sala 12" />
        </div>

        <div class="field">
          <label for="horario-inicio">Horário de início</label>
          <input type="time" id="horario-inicio" value="07:30" />
        </div>

        <div class="field">
          <label for="horario-fim">Horário de término</label>
          <input type="time" id="horario-fim" value="09:10" />
        </div>

        <div class="field field-full">
          <label>Dias da semana</label>
          <div class="dias-semana">
            <label class="dia"><input type="checkbox" value="seg" /> Seg</label>
            <label class="dia"><input type="checkbox" value="ter" /> Ter</label>
            <label class="dia"><input type="checkbox" value="qua" /> Qua</label>
            <label class="dia"><input type="checkbox" value="qui" /> Qui</label>
            <label class="dia"><input type="checkbox" value="sex" /> Sex</label>
          </div>
        </div>

        <div class="field field-full">
          <label for="descricao">Descrição / Observações</label>
          <textarea id="descricao" placeholder="Adicione uma descrição ou observações sobre a turma..."></textarea>
          <span class="hint">Opcional. Você pode editar depois.</span>
        </div>

      </div>

      <div class="form-actions">
        <a href="turmas.html" class="btn-secondary">Cancelar</a>
        <button type="submit" class="btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <path d="M22 4L12 14.01l-3-3"/>
          </svg>
          Criar Turma
        </button>
      </div>

    </form>

    <footer class="footer">
      <span class="dot" aria-hidden="true"></span>
      <p>© 2025 · Escola Estadual do Campo Frei Graciano Droessler</p>
    </footer>

  </div>

  <script>
    const nomeProfessor = sessionStorage.getItem('professorLogado');
    if (!nomeProfessor) window.location.href = 'professor.html';

    document.getElementById('form-nova-turma').addEventListener('submit', (e) => {
      e.preventDefault();
      const serie = document.getElementById('serie').value.trim();
      const materia = document.getElementById('materia').value;
      const turno = document.getElementById('turno').value;

      if (!serie || !materia || !turno) {
        alert('Preencha os campos obrigatórios: Série, Matéria e Turno.');
        return;
      }

      // Aqui você conecta com o backend depois
      alert('Turma "' + serie + '" criada com sucesso! (simulação)');
      window.location.href = 'turmas.html';
    });
  </script>

</body>
</html>
