<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1565c0" />
  <title>Área do Diretor · Frei Graciano Droessler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       Reset & Tokens
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white:          #ffffff;
      --white-soft:     #f7fbfe;

      --azul-bebe-50:   #eaf5fb;
      --azul-bebe-100:  #d3ecf8;
      --azul-bebe-200:  #b8e0f5;
      --azul-bebe-300:  #8ecbee;

      --azul-escuro:    #1565c0;
      --azul-escuro-2:  #0d47a1;

      --ink:            #0f1e35;
      --ink-soft:       #475569;

      --danger:         #dc2626;

      --shadow-sm: 0 1px 2px rgba(15, 30, 53, 0.06);
      --shadow-md: 0 10px 30px -10px rgba(21, 101, 192, 0.18);
      --shadow-lg: 0 30px 60px -20px rgba(21, 101, 192, 0.25);
      --ring: 0 0 0 4px rgba(184, 224, 245, 0.55);

      --radius-card: 28px;
      --radius-input: 14px;

      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-display: 'Playfair Display', Georgia, serif;
    }

    /* =========================================================
       Base
       ========================================================= */
    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      font-family: var(--font-sans);
      font-size: 16px;
      color: var(--ink);
      background-color: var(--white-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================================================
       Fundo decorativo
       ========================================================= */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background:
        radial-gradient(1200px 600px at 15% 10%, #ffffff 0%, transparent 60%),
        radial-gradient(900px 500px at 85% 90%, var(--azul-bebe-50) 0%, transparent 55%),
        linear-gradient(160deg, #ffffff 0%, var(--azul-bebe-50) 55%, #eaf5fb 100%);
    }

    .bg-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      pointer-events: none;
    }
    .bg-glow-1 {
      width: 480px; height: 480px;
      top: -160px; left: -140px;
      background: radial-gradient(circle, var(--azul-bebe-200) 0%, transparent 70%);
      animation: float 14s ease-in-out infinite;
    }
    .bg-glow-2 {
      width: 560px; height: 560px;
      bottom: -220px; right: -160px;
      background: radial-gradient(circle, var(--azul-bebe-100) 0%, transparent 70%);
      animation: float 18s ease-in-out infinite reverse;
    }

    .bg-grain {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(rgba(21, 101, 192, 0.05) 1px, transparent 1px);
      background-size: 22px 22px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
      opacity: 0.6;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(20px, -20px) scale(1.05); }
    }

    /* =========================================================
       Cartão de login
       ========================================================= */
    .login-card {
      position: relative;
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-card);
      padding: 44px 40px 26px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 28px;
      animation: card-in 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .login-card::before {
      content: "";
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--azul-escuro), transparent);
      border-radius: 0 0 4px 4px;
      opacity: 0.75;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* =========================================================
       Cabeçalho
       ========================================================= */
    .login-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
    }

    .icon-badge {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--azul-bebe-50), var(--azul-bebe-100));
      color: var(--azul-escuro);
      border: 1px solid var(--azul-bebe-100);
      box-shadow: 0 10px 24px -10px rgba(21, 101, 192, 0.35);
    }
    .icon-badge svg { width: 36px; height: 36px; }

    .login-title {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 5vw, 1.9rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, var(--ink) 0%, var(--azul-escuro-2) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-subtitle {
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--azul-escuro);
      opacity: 0.85;
    }

    .login-desc {
      font-size: 0.88rem;
      color: var(--ink-soft);
      line-height: 1.5;
      max-width: 320px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .divider span {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--azul-bebe-300), transparent);
    }
    .divider i {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--azul-escuro);
      box-shadow: 0 0 0 4px rgba(21, 101, 192, 0.12);
    }

    /* =========================================================
       Formulário
       ========================================================= */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: 0.01em;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap svg {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: var(--azul-escuro);
      opacity: 0.65;
      pointer-events: none;
    }

    .field input {
      width: 100%;
      font-family: var(--font-sans);
      font-size: 0.94rem;
      color: var(--ink);
      background: var(--white);
      border: 1px solid var(--azul-bebe-100);
      border-radius: var(--radius-input);
      padding: 13px 14px 13px 42px;
      outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    .field input::placeholder {
      color: #94a3b8;
      font-size: 0.88rem;
    }

    .field input:hover {
      border-color: var(--azul-bebe-200);
    }

    .field input:focus {
      border-color: var(--azul-escuro);
      box-shadow: var(--ring);
      background: var(--white);
    }

    /* Botão mostrar senha */
    .toggle-pass {
      position: absolute;
      right: 10px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      color: var(--ink-soft);
      display: grid;
      place-items: center;
      transition: color 0.25s ease, background 0.25s ease;
    }
    .toggle-pass:hover { color: var(--azul-escuro); background: var(--azul-bebe-50); }
    .toggle-pass svg { width: 18px; height: 18px; }

    /* Linha: lembrar + esqueci senha */
    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.83rem;
      color: var(--ink-soft);
      cursor: pointer;
      user-select: none;
    }
    .remember input {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 1.5px solid var(--azul-bebe-300);
      border-radius: 5px;
      background: var(--white);
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .remember input:checked {
      background: var(--azul-escuro);
      border-color: var(--azul-escuro);
    }
    .remember input:checked::after {
      content: "";
      position: absolute;
      left: 5px; top: 2px;
      width: 5px; height: 9px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .forgot {
      font-size: 0.83rem;
      font-weight: 500;
      color: var(--azul-escuro);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .forgot:hover { color: var(--azul-escuro-2); text-decoration: underline; }

    /* Botão entrar */
    .btn-enter {
      position: relative;
      width: 100%;
      margin-top: 4px;
      padding: 14px 20px;
      font-family: var(--font-sans);
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--white);
      background: linear-gradient(135deg, var(--azul-escuro), var(--azul-escuro-2));
      border: none;
      border-radius: var(--radius-input);
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 10px 24px -10px rgba(21, 101, 192, 0.6);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .btn-enter::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.35) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }

    .btn-enter:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -10px rgba(21, 101, 192, 0.7);
    }
    .btn-enter:hover::after { transform: translateX(100%); }
    .btn-enter:active { transform: translateY(0); }
    .btn-enter:focus-visible {
      outline: none;
      box-shadow: var(--ring), 0 10px 24px -10px rgba(21, 101, 192, 0.6);
    }

    /* =========================================================
       Rodapé
       ========================================================= */
    .login-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding-top: 16px;
      border-top: 1px solid var(--azul-bebe-100);
      margin-top: 4px;
    }
    .login-footer .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--azul-escuro);
      opacity: 0.6;
      flex-shrink: 0;
    }
    .login-footer p {
      font-size: 0.72rem;
      color: var(--ink-soft);
      letter-spacing: 0.01em;
      text-align: center;
      line-height: 1.4;
    }

    /* Link voltar */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--ink-soft);
      text-decoration: none;
      align-self: center;
      transition: color 0.25s ease, transform 0.25s ease;
    }
    .back-link:hover { color: var(--azul-escuro); transform: translateX(-3px); }
    .back-link svg { width: 14px; height: 14px; }

    /* =========================================================
       Responsivo
       ========================================================= */
    @media (max-width: 480px) {
      body { padding: 16px 12px; }

      .login-card {
        padding: 32px 22px 20px;
        border-radius: 22px;
        gap: 22px;
      }

      .icon-badge { width: 60px; height: 60px; border-radius: 16px; }
      .icon-badge svg { width: 30px; height: 30px; }

      .login-desc { font-size: 0.82rem; }
      .field input { padding: 12px 12px 12px 40px; font-size: 0.9rem; }
      .btn-enter { padding: 13px 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Fundo decorativo -->
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-grain"></div>
  </div>

  <main class="login-card" role="main">

    <!-- Cabeçalho -->
    <header class="login-header">
      <div class="icon-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18"/>
          <path d="M5 21V8l7-4 7 4v13"/>
          <path d="M10 12h4"/>
          <path d="M10 16h4"/>
          <path d="M10 21v-3h4v3"/>
        </svg>
      </div>

      <span class="login-subtitle">Acesso à Gestão</span>
      <h1 class="login-title">Área do Diretor</h1>

      <div class="divider" aria-hidden="true">
        <span></span><i></i><span></span>
      </div>

      <p class="login-desc">
        Entre com suas credenciais de direção para acessar o painel de gestão escolar.
      </p>
    </header>

    <!-- Formulário -->
    <form class="login-form" action="#" method="post" autocomplete="on">

      <!-- Usuário -->
      <div class="field">
        <label for="usuario">Usuário ou e-mail</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input
            type="text"
            id="usuario"
            name="usuario"
            placeholder="ex: direcao"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <!-- Senha -->
      <div class="field">
        <label for="senha">Senha</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          />
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar senha">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Linha: lembrar + esqueci -->
      <div class="form-row">
        <label class="remember" for="lembrar">
          <input type="checkbox" id="lembrar" name="lembrar" />
          Lembrar de mim
        </label>
        <a href="#" class="forgot">Esqueci a senha</a>
      </div>

      <!-- Botão Entrar -->
      <button type="submit" class="btn-enter">Entrar</button>

      <!-- Voltar -->
      <a href="1.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"/>
          <path d="M12 19l-7-7 7-7"/>
        </svg>
        Voltar à seleção de perfil
      </a>

    </form>

    <!-- Rodapé -->
    <footer class="login-footer">
      <span class="dot" aria-hidden="true"></span>
      <p>Acesso restrito à direção · Frei Graciano Droessler</p>
    </footer>

  </main>

  <!-- Script: mostrar/ocultar senha -->
  <script>
    const togglePass = document.getElementById('togglePass');
    const senha = document.getElementById('senha');

    togglePass.addEventListener('click', () => {
      const isPassword = senha.type === 'password';
      senha.type = isPassword ? 'text' : 'password';
      togglePass.setAttribute('aria-label', isPassword ? 'Ocultar senha' : 'Mostrar senha');
      togglePass.innerHTML = isPassword
        ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
             <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
             <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
             <line x1="1" y1="1" x2="23" y2="23"/>
           </svg>`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
             <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
             <circle cx="12" cy="12" r="3"/>
           </svg>`;
    });
  </script>

</body>
</html>
