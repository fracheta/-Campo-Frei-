<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1565c0" />
  <title>Turmas · Pedagogo · Frei Graciano Droessler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --white:#fff; --white-soft:#f7fbfe;
      --azul-bebe-50:#eaf5fb; --azul-bebe-100:#d3ecf8; --azul-bebe-200:#b8e0f5; --azul-bebe-300:#8ecbee;
      --azul-escuro:#1565c0; --azul-escuro-2:#0d47a1;
      --ink:#0f1e35; --ink-soft:#475569; --ink-mute:#94a3b8;
      --verde:#22c55e; --verde-2:#15803d; --amarelo:#f59e0b; --amarelo-2:#b45309;
      --vermelho:#dc2626; --roxo:#8b5cf6; --roxo-2:#6d28d9; --ciano:#06b6d4; --rosa:#ec4899;
      --shadow-sm:0 1px 2px rgba(15,30,53,.06); --shadow-md:0 10px 30px -10px rgba(21,101,192,.18);
      --shadow-lg:0 30px 60px -20px rgba(21,101,192,.25);
      --ring:0 0 0 4px rgba(184,224,245,.55);
      --radius:22px;
      --font-sans:'Inter',system-ui,sans-serif;
      --font-display:'Playfair Display',Georgia,serif;
    }
    html { scroll-behavior: smooth; }
    body {
      min-height:100vh; font-family:var(--font-sans); font-size:16px; color:var(--ink);
      background-color:var(--white-soft); padding:32px 20px 60px; overflow-x:hidden;
      position:relative; -webkit-font-smoothing:antialiased;
    }
    .bg-layer {
      position:fixed; inset:0; z-index:-1; overflow:hidden;
      background: radial-gradient(1200px 600px at 15% 10%, #fff 0%, transparent 60%),
                  radial-gradient(900px 500px at 85% 90%, var(--azul-bebe-50) 0%, transparent 55%),
                  linear-gradient(160deg, #fff 0%, var(--azul-bebe-50) 55%, #eaf5fb 100%);
    }
    .bg-glow { position:absolute; border-radius:50%; filter:blur(90px); opacity:.55; pointer-events:none; }
    .bg-glow-1 { width:480px;height:480px;top:-160px;left:-140px;background:radial-gradient(circle,var(--azul-bebe-200) 0%,transparent 70%);animation:float 14s ease-in-out infinite; }
    .bg-glow-2 { width:560px;height:560px;bottom:-220px;right:-160px;background:radial-gradient(circle,var(--azul-bebe-100) 0%,transparent 70%);animation:float 18s ease-in-out infinite reverse; }
    .bg-grain { position:absolute;inset:0;background-image:radial-gradient(rgba(21,101,192,.05) 1px,transparent 1px);background-size:22px 22px;mask-image:radial-gradient(circle at center,black 40%,transparent 80%);-webkit-mask-image:radial-gradient(circle at center,black 40%,transparent 80%);opacity:.6; }
    @keyframes float { 0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(20px,-20px) scale(1.05);} }
    .container { width:100%;max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px;animation:fade-in .7s cubic-bezier(.22,1,.36,1); }
    @keyframes fade-in { from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);} }
    /* TOPBAR */
    .topbar { display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 22px;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.9);border-radius:var(--radius);box-shadow:var(--shadow-md); }
    .brand { display:flex;align-items:center;gap:14px;min-width:0; }
    .brand-logo { width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--azul-escuro),var(--azul-escuro-2));color:#fff;font-family:var(--font-display);font-weight:700;font-size:1.1rem;flex-shrink:0;box-shadow:0 8px 20px -6px rgba(21,101,192,.55); }
    .brand-info .top { font-size:.66rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--azul-escuro);opacity:.85; }
    .brand-info .main { font-size:.92rem;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .topbar-actions { display:flex;align-items:center;gap:10px; }
    .user-chip { display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;background:var(--azul-bebe-50);border:1px solid var(--azul-bebe-100);border-radius:999px; }
    .user-chip .avatar { width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--roxo),var(--roxo-2));color:#fff;font-size:.85rem;font-weight:700;position:relative; }
    .user-chip .avatar::after { content:"";position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;border-radius:50%;background:var(--verde);border:2px solid #fff; }
    .user-chip .name { font-size:.85rem;font-weight:600;color:var(--ink);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .btn-top { display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:var(--white);border:1px solid var(--azul-bebe-100);border-radius:999px;color:var(--azul-escuro);font-family:inherit;font-size:.82rem;font-weight:600;cursor:pointer;text-decoration:none;transition:all .3s ease;white-space:nowrap; }
    .btn-top:hover { background:var(--azul-escuro);color:#fff;border-color:var(--azul-escuro);transform:translateX(-3px); }
    .btn-top svg { width:15px;height:15px; }
    /* HERO */
    .hero { padding:28px 32px;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(234,245,251,.9));backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.9);border-radius:var(--radius);box-shadow:var(--shadow-md);position:relative;overflow:hidden; }
    .hero::before { content:"";position:absolute;top:-50%;right:-10%;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(184,224,245,.5),transparent 70%);pointer-events:none; }
    .hero-content { position:relative;z-index:1; }
    .hero .eyebrow { font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--azul-escuro);margin-bottom:6px;display:inline-flex;align-items:center;gap:8px; }
    .hero .eyebrow::before { content:"";width:6px;height:6px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 4px rgba(34,197,94,.2); }
    .hero h1 { font-family:var(--font-display);font-size:clamp(1.5rem,3.5vw,2rem);font-weight:700;line-height:1.15;color:var(--ink);margin-bottom:6px;letter-spacing:-.01em; }
    .hero p { font-size:.92rem;color:var(--ink-soft);max-width:560px;line-height:1.5; }
    /* FILTROS */
    .filters { display:flex;gap:10px;flex-wrap:wrap;padding:14px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:var(--shadow-sm);align-items:center; }
    .search { position:relative;flex:1;min-width:220px; }
    .search svg { position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-mute);pointer-events:none; }
    .search input { width:100%;padding:11px 16px 11px 40px;font-family:inherit;font-size:.88rem;background:var(--white);border:1.5px solid var(--azul-bebe-100);border-radius:999px;outline:none;transition:all .25s ease; }
    .search input:focus { border-color:var(--azul-escuro);box-shadow:var(--ring); }
    .chip-group { display:flex;gap:6px;flex-wrap:wrap; }
    .chip { padding:8px 14px;background:var(--white);border:1.5px solid var(--azul-bebe-100);border-radius:999px;font-family:inherit;font-size:.78rem;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all .25s ease; }
    .chip:hover { color:var(--azul-escuro);border-color:var(--azul-bebe-300); }
    .chip.active { background:var(--azul-escuro);color:#fff;border-color:var(--azul-escuro);box-shadow:0 6px 14px -4px rgba(21,101,192,.5); }
    /* GRID TURMAS */
    .turmas-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px; }
    .turma-card { padding:20px;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:var(--shadow-sm);text-decoration:none;color:inherit;position:relative;overflow:hidden;transition:all .35s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;gap:14px; }
    .turma-card::before { content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--grad); }
    .turma-card:hover { transform:translateY(-6px);box-shadow:var(--shadow-lg); }
    .turma-card.c1 { --grad:linear-gradient(90deg,#1565c0,#0d47a1); }
    .turma-card.c2 { --grad:linear-gradient(90deg,#22c55e,#15803d); }
    .turma-card.c3 { --grad:linear-gradient(90deg,#f59e0b,#b45309); }
    .turma-card.c4 { --grad:linear-gradient(90deg,#8b5cf6,#6d28d9); }
    .turma-card.c5 { --grad:linear-gradient(90deg,#06b6d4,#0e7490); }
    .turma-card.c6 { --grad:linear-gradient(90deg,#ec4899,#be185d); }
    .turma-head { display:flex;align-items:center;gap:14px; }
    .turma-avatar { width:56px;height:56px;border-radius:15px;display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-size:1.2rem;font-weight:700;flex-shrink:0;box-shadow:0 10px 22px -8px rgba(21,101,192,.5); }
    .turma-avatar.c1 { background:linear-gradient(135deg,#1565c0,#0d47a1); }
    .turma-avatar.c2 { background:linear-gradient(135deg,#22c55e,#15803d); }
    .turma-avatar.c3 { background:linear-gradient(135deg,#f59e0b,#b45309); }
    .turma-avatar.c4 { background:linear-gradient(135deg,#8b5cf6,#6d28d9); }
    .turma-avatar.c5 { background:linear-gradient(135deg,#06b6d4,#0e7490); }
    .turma-avatar.c6 { background:linear-gradient(135deg,#ec4899,#be185d); }
    .turma-info { flex:1;min-width:0; }
    .turma-serie { font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--azul-escuro);margin-bottom:2px; }
    .turma-nome { font-family:var(--font-display);font-size:1.15rem;font-weight:700;color:var(--ink);line-height:1.2;letter-spacing:-.01em; }
    .turma-prof { font-size:.78rem;color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:6px; }
    .turma-prof svg { width:12px;height:12px;color:var(--azul-escuro); }
    .turma-stats { display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:14px;border-top:1px solid var(--azul-bebe-100); }
    .turma-stat { text-align:center; }
    .turma-stat-value { font-family:var(--font-display);font-size:1.1rem;font-weight:700;color:var(--ink);line-height:1;margin-bottom:3px; }
    .turma-stat-value.green { color:var(--verde-2); }
    .turma-stat-value.amber { color:var(--amarelo-2); }
    .turma-stat-value.red { color:var(--vermelho); }
    .turma-stat-label { font-size:.62rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft); }
    .empty-box { grid-column:1/-1;text-align:center;padding:60px 24px;color:var(--ink-soft);background:rgba(255,255,255,.7);border:1.5px dashed var(--azul-bebe-200);border-radius:20px; }
    .empty-box svg { width:48px;height:48px;color:var(--azul-bebe-300);margin-bottom:12px; }
    .empty-box h3 { font-family:var(--font-display);font-size:1.15rem;color:var(--ink);margin-bottom:4px; }
    /* FOOTER */
    .footer { margin-top:12px;display:flex;align-items:center;justify-content:center;gap:10px;padding:20px 24px;background:rgba(255,255,255,.6);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:var(--shadow-sm); }
    .footer .dot { width:6px;height:6px;border-radius:50%;background:var(--azul-escuro);opacity:.6; }
    .footer p { font-size:.76rem;color:var(--ink-soft); }
    @media (max-width:640px) {
      body { padding:20px 14px 40px; }
      .topbar { padding:14px 16px; }
      .btn-top span { display:none; }
      .user-chip .name { max-width:100px; }
      .hero { padding:22px 20px; }
      .turmas-grid { grid-template-columns:1fr; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important;transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"><div class="bg-glow bg-glow-1"></div><div class="bg-glow bg-glow-2"></div><div class="bg-grain"></div></div>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">FG</div>
        <div class="brand-info">
          <div class="top">Área Pedagógica</div>
          <div class="main">Frei Graciano Droessler</div>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="user-chip">
          <div class="avatar" id="user-avatar">P</div>
          <span class="name" id="user-name">Pedagogo(a)</span>
        </div>
        <a href="3.html" class="btn-top" title="Voltar ao painel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
          <span>Painel</span>
        </a>
      </div>
    </header>

    <section class="hero">
      <div class="hero-content">
        <div class="eyebrow">Ano letivo 2025</div>
        <h1>Todas as turmas da escola</h1>
        <p>Acompanhe as 8 turmas do 6º ao 9º ano com dados de alunos, média geral e frequência.</p>
      </div>
    </section>

    <section class="filters">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="busca" placeholder="Buscar turma ou professor..." />
      </div>
      <div class="chip-group" id="chips">
        <button class="chip active" data-serie="">Todas</button>
        <button class="chip" data-serie="6º Ano">6º</button>
        <button class="chip" data-serie="7º Ano">7º</button>
        <button class="chip" data-serie="8º Ano">8º</button>
        <button class="chip" data-serie="9º Ano">9º</button>
      </div>
    </section>

    <section class="turmas-grid" id="turmas-grid"></section>

    <footer class="footer"><span class="dot"></span><p>© 2025 · Escola Estadual do Campo Frei Graciano Droessler</p></footer>
  </div>

  <script>
    const nomePedagogo = sessionStorage.getItem('pedagogoLogado');
    if (!nomePedagogo) window.location.href = '2.html';
    document.getElementById('user-name').textContent = nomePedagogo || 'Pedagogo';
    document.getElementById('user-avatar').textContent = (nomePedagogo || 'P').trim().charAt(0).toUpperCase();

    // Base de turmas 6º ao 9º
    const turmasBase = [
      { id:'6a', serie:'6º Ano', nome:'6º Ano A', sigla:'6A', professor:'Mariana Alves', alunos:30, media:7.6, freq:93, cor:'c1' },
      { id:'6b', serie:'6º Ano', nome:'6º Ano B', sigla:'6B', professor:'Rafael Costa', alunos:28, media:7.2, freq:89, cor:'c2' },
      { id:'7a', serie:'7º Ano', nome:'7º Ano A', sigla:'7A', professor:'Mariana Alves', alunos:32, media:8.1, freq:94, cor:'c3' },
      { id:'7b', serie:'7º Ano', nome:'7º Ano B', sigla:'7B', professor:'Rafael Costa', alunos:29, media:6.8, freq:82, cor:'c4' },
      { id:'8a', serie:'8º Ano', nome:'8º Ano A', sigla:'8A', professor:'Mariana Alves', alunos:31, media:7.9, freq:95, cor:'c5' },
      { id:'8b', serie:'8º Ano', nome:'8º Ano B', sigla:'8B', professor:'Rafael Costa', alunos:28, media:6.5, freq:79, cor:'c6' },
      { id:'9a', serie:'9º Ano', nome:'9º Ano A', sigla:'9A', professor:'Mariana Alves', alunos:32, media:8.3, freq:96, cor:'c1' },
      { id:'9b', serie:'9º Ano', nome:'9º Ano B', sigla:'9B', professor:'Rafael Costa', alunos:30, media:7.4, freq:87, cor:'c2' }
    ];

    let turmas = [...turmasBase];
    try {
      const salvas = JSON.parse(localStorage.getItem('turmasProfessor') || '[]');
      if (salvas.length > 0) {
        turmas = turmasBase.map(b => {
          const s = salvas.find(x => x.id === b.id || x.sigla === b.sigla);
          return s ? { ...b, ...s } : b;
        });
      }
    } catch(e) {}

    let filtroSerie = '';
    let buscaAtual = '';
    const grid = document.getElementById('turmas-grid');

    function render() {
      const termo = buscaAtual.toLowerCase().trim();
      let lista = turmas.filter(t => {
        if (filtroSerie && t.serie !== filtroSerie) return false;
        if (termo) {
          const hay = (t.nome + ' ' + t.professor + ' ' + t.serie).toLowerCase();
          if (!hay.includes(termo)) return false;
        }
        return true;
      });

      if (lista.length === 0) {
        grid.innerHTML = `<div class="empty-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <h3>Nenhuma turma encontrada</h3>
          <p>Ajuste os filtros para ver mais turmas.</p>
        </div>`;
        return;
      }

      grid.innerHTML = lista.map(t => {
        const freqCls = t.freq >= 88 ? 'green' : t.freq >= 80 ? 'amber' : 'red';
        const medCls = t.media >= 7 ? 'green' : t.media >= 6 ? 'amber' : 'red';
        const iniciais = t.professor.split(' ').map(n => n[0]).slice(0,2).join('').toUpperCase();
        return `
          <a class="turma-card ${t.cor}" href="turma-detalhes.html?id=${encodeURIComponent(t.id)}">
            <div class="turma-head">
              <div class="turma-avatar ${t.cor}">${t.sigla}</div>
              <div class="turma-info">
                <div class="turma-serie">${t.serie}</div>
                <div class="turma-nome">${t.nome}</div>
                <div class="turma-prof">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  ${t.professor}
                </div>
              </div>
            </div>
            <div class="turma-stats">
              <div class="turma-stat">
                <div class="turma-stat-value">${t.alunos}</div>
                <div class="turma-stat-label">Alunos</div>
              </div>
              <div class="turma-stat">
                <div class="turma-stat-value ${medCls}">${t.media.toFixed(1)}</div>
                <div class="turma-stat-label">Média</div>
              </div>
              <div class="turma-stat">
                <div class="turma-stat-value ${freqCls}">${t.freq}%</div>
                <div class="turma-stat-label">Freq.</div>
              </div>
            </div>
          </a>`;
      }).join('');
    }

    document.getElementById('busca').addEventListener('input', e => { buscaAtual = e.target.value; render(); });
    document.querySelectorAll('#chips .chip').forEach(c => {
      c.addEventListener('click', () => {
        document.querySelectorAll('#chips .chip').forEach(x => x.classList.remove('active'));
        c.classList.add('active');
        filtroSerie = c.dataset.serie;
        render();
      });
    });
    render();
  </script>
</body>
</html>
