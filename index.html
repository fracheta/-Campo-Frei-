<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1565c0" />
  <title>Escola Estadual do Campo Frei Graciano Droessler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       Reset & Tokens
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Paleta 60 / 30 / 10 */
      --white:          #ffffff;
      --white-soft:     #f7fbfe;

      --azul-bebe-50:   #eaf5fb;
      --azul-bebe-100:  #d3ecf8;
      --azul-bebe-200:  #b8e0f5;   /* 30% */
      --azul-bebe-300:  #8ecbee;

      --azul-escuro:    #1565c0;   /* 10% */
      --azul-escuro-2:  #0d47a1;

      --ink:            #0f1e35;
      --ink-soft:       #475569;

      /* Efeitos */
      --shadow-sm: 0 1px 2px rgba(15, 30, 53, 0.06);
      --shadow-md: 0 10px 30px -10px rgba(21, 101, 192, 0.18);
      --shadow-lg: 0 30px 60px -20px rgba(21, 101, 192, 0.25);
      --ring: 0 0 0 4px rgba(184, 224, 245, 0.55);

      --radius-card: 28px;
      --radius-pill: 16px;

      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-display: 'Playfair Display', Georgia, serif;
    }

    /* =========================================================
       Base
       ========================================================= */
    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      font-family: var(--font-sans);
      font-size: 16px;
      color: var(--ink);
      background-color: var(--white-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================================================
       Fundo decorativo
       ========================================================= */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background:
        radial-gradient(1200px 600px at 15% 10%, #ffffff 0%, transparent 60%),
        radial-gradient(900px 500px at 85% 90%, var(--azul-bebe-50) 0%, transparent 55%),
        linear-gradient(160deg, #ffffff 0%, var(--azul-bebe-50) 55%, #eaf5fb 100%);
    }

    .bg-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      pointer-events: none;
    }
    .bg-glow-1 {
      width: 480px; height: 480px;
      top: -160px; left: -140px;
      background: radial-gradient(circle, var(--azul-bebe-200) 0%, transparent 70%);
      animation: float 14s ease-in-out infinite;
    }
    .bg-glow-2 {
      width: 560px; height: 560px;
      bottom: -220px; right: -160px;
      background: radial-gradient(circle, var(--azul-bebe-100) 0%, transparent 70%);
      animation: float 18s ease-in-out infinite reverse;
    }

    .bg-grain {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(rgba(21, 101, 192, 0.05) 1px, transparent 1px);
      background-size: 22px 22px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
      opacity: 0.6;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(20px, -20px) scale(1.05); }
    }

    /* =========================================================
       Cartão principal
       ========================================================= */
    .welcome-card {
      position: relative;
      width: 100%;
      max-width: 720px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-card);
      padding: 48px 44px 28px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 36px;
      animation: card-in 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .welcome-card::before {
      content: "";
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--azul-escuro), transparent);
      border-radius: 0 0 4px 4px;
      opacity: 0.75;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* =========================================================
       Cabeçalho
       ========================================================= */
    .school-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
    }

    .logo-ring {
      position: relative;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      padding: 6px;
      background: conic-gradient(from 140deg, var(--azul-bebe-200), var(--white), var(--azul-bebe-100), var(--azul-bebe-200));
      box-shadow:
        0 10px 26px -8px rgba(21, 101, 192, 0.28),
        inset 0 0 0 1px rgba(255, 255, 255, 0.9);
    }
    .logo-ring::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px dashed rgba(21, 101, 192, 0.22);
      animation: spin 26s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .logo-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: inset 0 2px 6px rgba(21, 101, 192, 0.08);
    }

    .school-logo {
      width: 82%;
      height: 82%;
      object-fit: contain;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 120px;
    }
    .divider span {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--azul-bebe-300), transparent);
    }
    .divider i {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--azul-escuro);
      box-shadow: 0 0 0 4px rgba(21, 101, 192, 0.12);
    }

    .school-name {
      font-family: var(--font-display);
      line-height: 1.15;
      letter-spacing: -0.01em;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .school-name-top {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--azul-escuro);
      opacity: 0.85;
    }
    .school-name-main {
      font-size: clamp(1.55rem, 4.2vw, 2.35rem);
      font-weight: 700;
      color: var(--ink);
      background: linear-gradient(135deg, var(--ink) 0%, var(--azul-escuro-2) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-text {
      font-size: 0.9rem;
      color: var(--ink-soft);
      font-weight: 500;
      max-width: 380px;
    }

    /* =========================================================
       Cartões de perfil
       ========================================================= */
    .profiles {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .profile-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 20px;
      background: var(--white);
      border: 1px solid var(--azul-bebe-100);
      border-radius: var(--radius-pill);
      text-decoration: none;
      color: var(--ink);
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.35s ease,
                  border-color 0.35s ease,
                  background 0.35s ease;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .profile-card::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--azul-escuro);
      transform: scaleY(0);
      transform-origin: center;
      transition: transform 0.35s ease;
      border-radius: 4px 0 0 4px;
    }

    .profile-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(400px circle at var(--mx, 50%) var(--my, 50%),
                  rgba(184, 224, 245, 0.35), transparent 45%);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .profile-card:hover {
      transform: translateY(-3px);
      border-color: var(--azul-bebe-200);
      box-shadow: var(--shadow-md);
    }
    .profile-card:hover::before { transform: scaleY(1); }
    .profile-card:hover::after  { opacity: 1; }

    .profile-card:focus-visible {
      outline: none;
      box-shadow: var(--ring), var(--shadow-md);
    }

    .profile-card:active { transform: translateY(-1px); }

    .profile-icon {
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--azul-bebe-50), var(--azul-bebe-100));
      color: var(--azul-escuro);
      border: 1px solid var(--azul-bebe-100);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                  background 0.35s ease,
                  color 0.35s ease;
    }
    .profile-icon svg { width: 26px; height: 26px; }

    .profile-card:hover .profile-icon {
      background: linear-gradient(135deg, var(--azul-escuro), var(--azul-escuro-2));
      color: var(--white);
      transform: scale(1.05) rotate(-3deg);
    }

    .profile-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .profile-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    .profile-desc {
      font-size: 0.8rem;
      color: var(--ink-soft);
      font-weight: 400;
    }

    .profile-arrow {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--azul-bebe-50);
      color: var(--azul-escuro);
      transition: transform 0.35s ease, background 0.35s ease, color 0.35s ease;
    }
    .profile-arrow svg { width: 16px; height: 16px; }

    .profile-card:hover .profile-arrow {
      background: var(--azul-escuro);
      color: var(--white);
      transform: translateX(4px);
    }

    /* =========================================================
       Rodapé
       ========================================================= */
    .page-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding-top: 16px;
      border-top: 1px solid var(--azul-bebe-100);
      margin-top: 4px;
    }
    .page-footer .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--azul-escuro);
      opacity: 0.6;
    }
    .page-footer p {
      font-size: 0.75rem;
      color: var(--ink-soft);
      letter-spacing: 0.01em;
      text-align: center;
    }

    /* =========================================================
       Responsivo
       ========================================================= */
    @media (min-width: 640px) {
      .welcome-card { padding: 56px 52px 32px; gap: 40px; }
      .logo-ring    { width: 148px; height: 148px; }
      .welcome-text { font-size: 0.95rem; }
    }

    @media (max-width: 480px) {
      body { padding: 16px 12px; }

      .welcome-card {
        padding: 36px 20px 20px;
        border-radius: 22px;
        gap: 26px;
      }

      .logo-ring { width: 108px; height: 108px; }
      .divider   { width: 90px; }

      .school-name-top  { font-size: 0.68rem; letter-spacing: 0.18em; }
      .welcome-text     { font-size: 0.82rem; }

      .profile-card     { padding: 14px 16px; gap: 14px; border-radius: 14px; }
      .profile-icon     { width: 44px; height: 44px; border-radius: 12px; }
      .profile-icon svg { width: 22px; height: 22px; }
      .profile-title    { font-size: 0.94rem; }
      .profile-desc     { font-size: 0.74rem; }
      .profile-arrow    { width: 30px; height: 30px; }
    }

    @media (max-width: 360px) {
      .profile-desc { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Fundo decorativo -->
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-grain"></div>
  </div>

  <main class="welcome-card" role="main">

    <!-- Cabeçalho: Logo + Nome -->
    <header class="school-header">
      <div class="logo-ring">
        <div class="logo-inner">
          <img src="logo.png" alt="Logo da Escola Estadual do Campo Frei Graciano Droessler" class="school-logo" />
        </div>
      </div>

      <div class="divider" aria-hidden="true">
        <span></span><i></i><span></span>
      </div>

      <h1 class="school-name">
        <span class="school-name-top">Escola Estadual do Campo</span>
        <span class="school-name-main">Frei Graciano Droessler</span>
      </h1>

      <p class="welcome-text">
        Portal de acesso restrito · Selecione seu perfil para continuar
      </p>
    </header>

    <!-- Botões de perfil -->
    <nav class="profiles" aria-label="Selecione seu perfil">

      <a href="professor.html" class="profile-card">
        <span class="profile-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 4h20v12H2z"/>
            <path d="M12 16v5"/>
            <path d="M8 21h8"/>
            <path d="M7 8h4"/>
            <path d="M7 12h7"/>
          </svg>
        </span>
        <span class="profile-info">
          <span class="profile-title">Sou Professor</span>
          <span class="profile-desc">Acesso às turmas e conteúdos</span>
        </span>
        <span class="profile-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/>
            <path d="M13 6l6 6-6 6"/>
          </svg>
        </span>
      </a>

      <a href="pedagogo.html" class="profile-card">
        <span class="profile-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h7a3 3 0 0 1 3 3v13a3 3 0 0 0-3-3H4z"/>
            <path d="M20 4h-7a3 3 0 0 0-3 3v13a3 3 0 0 1 3-3h7z"/>
          </svg>
        </span>
        <span class="profile-info">
          <span class="profile-title">Sou Pedagogo</span>
          <span class="profile-desc">Acompanhamento pedagógico</span>
        </span>
        <span class="profile-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/>
            <path d="M13 6l6 6-6 6"/>
          </svg>
        </span>
      </a>

      <a href="diretor.html" class="profile-card">
        <span class="profile-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21h18"/>
            <path d="M5 21V8l7-4 7 4v13"/>
            <path d="M10 12h4"/>
            <path d="M10 16h4"/>
            <path d="M10 21v-3h4v3"/>
          </svg>
        </span>
        <span class="profile-info">
          <span class="profile-title">Sou Diretor</span>
          <span class="profile-desc">Gestão escolar completa</span>
        </span>
        <span class="profile-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/>
            <path d="M13 6l6 6-6 6"/>
          </svg>
        </span>
      </a>

    </nav>

    <footer class="page-footer">
      <span class="dot" aria-hidden="true"></span>
      <p>© 2025 · Escola Estadual do Campo Frei Graciano Droessler</p>
    </footer>

  </main>

  <!-- Brilho que segue o mouse nos cards -->
  <script>
    document.querySelectorAll('.profile-card').forEach(card => {
      card.addEventListener('mousemove', e => {
        const rect = card.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        card.style.setProperty('--mx', x + '%');
        card.style.setProperty('--my', y + '%');
      });
    });
  </script>

</body>
</html>
