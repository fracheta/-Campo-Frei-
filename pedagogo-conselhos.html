<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1565c0" />
  <title>Conselhos · Pedagogo · Frei Graciano Droessler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --white:#fff; --white-soft:#f7fbfe;
      --azul-bebe-50:#eaf5fb; --azul-bebe-100:#d3ecf8; --azul-bebe-200:#b8e0f5; --azul-bebe-300:#8ecbee;
      --azul-escuro:#1565c0; --azul-escuro-2:#0d47a1;
      --ink:#0f1e35; --ink-soft:#475569; --ink-mute:#94a3b8;
      --verde:#22c55e; --verde-2:#15803d; --amarelo:#f59e0b; --amarelo-2:#b45309;
      --vermelho:#dc2626; --roxo:#8b5cf6; --roxo-2:#6d28d9; --ciano:#06b6d4; --rosa:#ec4899;
      --shadow-sm:0 1px 2px rgba(15,30,53,.06); --shadow-md:0 10px 30px -10px rgba(21,101,192,.18);
      --shadow-lg:0 30px 60px -20px rgba(21,101,192,.25);
      --radius:22px;
      --font-sans:'Inter',system-ui,sans-serif;
      --font-display:'Playfair Display',Georgia,serif;
    }
    html { scroll-behavior: smooth; }
    body { min-height:100vh;font-family:var(--font-sans);font-size:16px;color:var(--ink);background-color:var(--white-soft);padding:32px 20px 60px;overflow-x:hidden;position:relative;-webkit-font-smoothing:antialiased; }
    .bg-layer { position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1200px 600px at 15% 10%,#fff 0%,transparent 60%),radial-gradient(900px 500px at 85% 90%,var(--azul-bebe-50) 0%,transparent 55%),linear-gradient(160deg,#fff 0%,var(--azul-bebe-50) 55%,#eaf5fb 100%); }
    .bg-glow { position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;pointer-events:none; }
    .bg-glow-1 { width:480px;height:480px;top:-160px;left:-140px;background:radial-gradient(circle,var(--azul-bebe-200) 0%,transparent 70%);animation:float 14s ease-in-out infinite; }
    .bg-glow-2 { width:560px;height:560px;bottom:-220px;right:-160px;background:radial-gradient(circle,var(--azul-bebe-100) 0%,transparent 70%);animation:float 18s ease-in-out infinite reverse; }
    .bg-grain { position:absolute;inset:0;background-image:radial-gradient(rgba(21,101,192,.05) 1px,transparent 1px);background-size:22px 22px;mask-image:radial-gradient(circle at center,black 40%,transparent 80%);-webkit-mask-image:radial-gradient(circle at center,black 40%,transparent 80%);opacity:.6; }
    @keyframes float { 0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(20px,-20px) scale(1.05);} }
    .container { width:100%;max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px;animation:fade-in .7s cubic-bezier(.22,1,.36,1); }
    @keyframes fade-in { from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);} }
    .topbar { display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 22px;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.9);border-radius:var(--radius);box-shadow:var(--shadow-md); }
    .brand { display:flex;align-items:center;gap:14px;min-width:0; }
    .brand-logo { width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ciano),#0e7490);color:#fff;font-family:var(--font-display);font-weight:700;font-size:1.1rem;flex-shrink:0;box-shadow:0 8px 20px -6px rgba(6,182,212,.5); }
    .brand-info .top { font-size:.66rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ciano);opacity:.85; }
    .brand-info .main { font-size:.92rem;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .topbar-actions { display:flex;align-items:center;gap:10px; }
    .user-chip { display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;background:var(--azul-bebe-50);border:1px solid var(--azul-bebe-100);border-radius:999px; }
    .user-chip .avatar { width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--roxo),var(--roxo-2));color:#fff;font-size:.85rem;font-weight:700;position:relative; }
    .user-chip .avatar::after { content:"";position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;border-radius:50%;background:var(--verde);border:2px solid #fff; }
    .user-chip .name { font-size:.85rem;font-weight:600;color:var(--ink);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .btn-top { display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:var(--white);border:1px solid var(--azul-bebe-100);border-radius:999px;color:var(--azul-escuro);font-family:inherit;font-size:.82rem;font-weight:600;cursor:pointer;text-decoration:none;transition:all .3s ease;white-space:nowrap; }
    .btn-top:hover { background:var(--azul-escuro);color:#fff;border-color:var(--azul-escuro);transform:translateX(-3px); }
    .btn-top svg { width:15px;height:15px; }
    .hero { padding:28px 32px;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(234,245,251,.9));backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.9);border-radius:var(--radius);box-shadow:var(--shadow-md);position:relative;overflow:hidden; }
    .hero::before { content:"";position:absolute;top:-50%;right:-10%;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(6,182,212,.15),transparent 70%);pointer-events:none; }
    .hero-content { position:relative;z-index:1; }
    .hero .eyebrow { font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ciano);margin-bottom:6px;display:inline-flex;align-items:center;gap:8px; }
    .hero .eyebrow::before { content:"";width:6px;height:6px;border-radius:50%;background:var(--ciano);box-shadow:0 0 0 4px rgba(6,182,212,.2); }
    .hero h1 { font-family:var(--font-display);font-size:clamp(1.5rem,3.5vw,2rem);font-weight:700;line-height:1.15;color:var(--ink);margin-bottom:6px;letter-spacing:-.01em; }
    .hero p { font-size:.92rem;color:var(--ink-soft);max-width:560px;line-height:1.5; }
    .conselhos-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px; }
    .conselho-card { padding:20px;background:rgba(255,255,255,.95);border:1px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:14px;transition:all .35s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden; }
    .conselho-card::before { content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--ciano),#0e7490); }
    .conselho-card:hover { transform:translateY(-5px);box-shadow:var(--shadow-lg); }
    .conselho-head { display:flex;align-items:center;gap:12px; }
    .conselho-icon { width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ciano),#0e7490);color:#fff;flex-shrink:0;box-shadow:0 10px 22px -8px rgba(6,182,212,.5); }
    .conselho-icon svg { width:22px;height:22px; }
    .conselho-title { flex:1;min-width:0; }
    .conselho-eyebrow { font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ciano);margin-bottom:2px; }
    .conselho-nome { font-family:var(--font-display);font-size:1.1rem;font-weight:700;color:var(--ink);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .conselho-meta { display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--ink-soft); }
    .conselho-meta span { display:inline-flex;align-items:center;gap:5px; }
    .conselho-meta svg { width:12px;height:12px;color:var(--azul-escuro); }
    .conselho-actions { display:flex;gap:8px;margin-top:auto; }
    .btn-mini { flex:1;padding:10px 14px;border-radius:11px;font-family:inherit;font-size:.78rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .25s ease;border:none;white-space:nowrap; }
    .btn-mini svg { width:14px;height:14px; }
    .btn-mini.primary { background:linear-gradient(135deg,var(--azul-escuro),var(--azul-escuro-2));color:#fff;box-shadow:0 6px 14px -5px rgba(21,101,192,.5); }
    .btn-mini.primary:hover { transform:translateY(-2px);box-shadow:0 10px 20px -5px rgba(21,101,192,.6); }
    .btn-mini.ghost { background:#fff;border:1.5px solid var(--azul-bebe-200);color:var(--azul-escuro); }
    .btn-mini.ghost:hover { background:var(--azul-bebe-50);border-color:var(--azul-bebe-300); }
    .empty-box { grid-column:1/-1;text-align:center;padding:70px 24px;color:var(--ink-soft);background:rgba(255,255,255,.7);border:1.5px dashed var(--azul-bebe-200);border-radius:20px; }
    .empty-box svg { width:56px;height:56px;color:var(--azul-bebe-300);margin-bottom:14px; }
    .empty-box h3 { font-family:var(--font-display);font-size:1.2rem;color:var(--ink);margin-bottom:4px; }
    .footer { margin-top:12px;display:flex;align-items:center;justify-content:center;gap:10px;padding:20px 24px;background:rgba(255,255,255,.6);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:var(--shadow-sm); }
    .footer .dot { width:6px;height:6px;border-radius:50%;background:var(--azul-escuro);opacity:.6; }
    .footer p { font-size:.76rem;color:var(--ink-soft); }
    @media (max-width:640px) {
      body { padding:20px 14px 40px; }
      .topbar { padding:14px 16px; }
      .btn-top span { display:none; }
      .user-chip .name { max-width:100px; }
      .hero { padding:22px 20px; }
      .conselhos-grid { grid-template-columns:1fr; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important;transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"><div class="bg-glow bg-glow-1"></div><div class="bg-glow bg-glow-2"></div><div class="bg-grain"></div></div>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">FG</div>
        <div class="brand-info">
          <div class="top">Área Pedagógica</div>
          <div class="main">Frei Graciano Droessler</div>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="user-chip">
          <div class="avatar" id="user-avatar">P</div>
          <span class="name" id="user-name">Pedagogo(a)</span>
        </div>
        <a href="3.html" class="btn-top" title="Voltar ao painel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
          <span>Painel</span>
        </a>
      </div>
    </header>

    <section class="hero">
      <div class="hero-content">
        <div class="eyebrow">Ano letivo 2025</div>
        <h1>Conselhos de Classe</h1>
        <p>Acompanhe as fichas e atas registradas pelos professores em cada turma.</p>
      </div>
    </section>

    <section class="conselhos-grid" id="grid"></section>

    <footer class="footer"><span class="dot"></span><p>© 2025 · Escola Estadual do Campo Frei Graciano Droessler</p></footer>
  </div>

  <script>
    const nomePedagogo = sessionStorage.getItem('pedagogoLogado');
    if (!nomePedagogo) window.location.href = '2.html';
    document.getElementById('user-name').textContent = nomePedagogo || 'Pedagogo';
    document.getElementById('user-avatar').textContent = (nomePedagogo || 'P').trim().charAt(0).toUpperCase();

    let conselhos = {};
    let fichas = {};
    try { conselhos = JSON.parse(localStorage.getItem('conselhosProfessor') || '{}'); } catch(e) {}
    try { fichas = JSON.parse(localStorage.getItem('fichasConselho') || '{}'); } catch(e) {}

    // Base de conselhos (mock se não houver no localStorage)
    const conselhosBase = {
      '6a': { turma: '6º Ano A', componente: 'Matemática', professor: 'Mariana Alves', data: '2025-10-10' },
      '7a': { turma: '7º Ano A', componente: 'Matemática', professor: 'Mariana Alves', data: '2025-10-08' },
      '9a': { turma: '9º Ano A', componente: 'Matemática', professor: 'Mariana Alves', data: '2025-10-15' },
      '8a': { turma: '8º Ano A', componente: 'Matemática', professor: 'Rafael Costa', data: '2025-10-12' },
      '9b': { turma: '9º Ano B', componente: 'Matemática', professor: 'Rafael Costa', data: '2025-10-11' }
    };

    // Se não houver salvos, usa base
    if (Object.keys(conselhos).length === 0 && Object.keys(fichas).length === 0) {
      conselhos = conselhosBase;
    }

    const grid = document.getElementById('grid');
    const todos = { ...fichas, ...conselhos };
    const chaves = Object.keys(todos);

    if (chaves.length === 0) {
      grid.innerHTML = `<div class="empty-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
        </svg>
        <h3>Nenhum conselho registrado</h3>
        <p>Assim que os professores preencherem as fichas, elas aparecerão aqui.</p>
      </div>`;
    } else {
      grid.innerHTML = chaves.map(k => {
        const c = todos[k];
        const data = c.data || c.atualizadoEm;
        const dataFmt = data ? new Date(data).toLocaleDateString('pt-BR') : '—';
        return `
          <div class="conselho-card">
            <div class="conselho-head">
              <div class="conselho-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                  <circle cx="9" cy="7" r="4"/>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
              </div>
              <div class="conselho-title">
                <div class="conselho-eyebrow">${c.componente || 'Conselho'}</div>
                <div class="conselho-nome">${c.turma || 'Turma'}</div>
              </div>
            </div>
            <div class="conselho-meta">
              <span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                ${dataFmt}
              </span>
              ${c.professor ? `
                <span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  ${c.professor}
                </span>` : ''}
            </div>
            <div class="conselho-actions">
              <a href="conselho.html?turma=${encodeURIComponent(k)}" class="btn-mini primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                Ver conselho
              </a>
              <a href="turma-detalhes.html?id=${encodeURIComponent(k)}" class="btn-mini ghost">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                Turma
              </a>
            </div>
          </div>`;
      }).join('');
    }
  </script>
</body>
</html>
