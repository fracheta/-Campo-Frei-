<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1565c0" />
  <title>Minhas Turmas · Frei Graciano Droessler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #ffffff;
      --white-soft: #f7fbfe;
      --azul-bebe-50: #eaf5fb;
      --azul-bebe-100: #d3ecf8;
      --azul-bebe-200: #b8e0f5;
      --azul-bebe-300: #8ecbee;
      --azul-escuro: #1565c0;
      --azul-escuro-2: #0d47a1;
      --ink: #0f1e35;
      --ink-soft: #475569;
      --ink-mute: #94a3b8;
      --verde: #22c55e;
      --amarelo: #f59e0b;
      --vermelho: #dc2626;
      --roxo: #8b5cf6;
      --rosa: #ec4899;
      --ciano: #06b6d4;
      --shadow-sm: 0 1px 2px rgba(15, 30, 53, 0.06);
      --shadow-md: 0 10px 30px -10px rgba(21, 101, 192, 0.18);
      --shadow-lg: 0 30px 60px -20px rgba(21, 101, 192, 0.25);
      --ring: 0 0 0 4px rgba(184, 224, 245, 0.55);
      --radius-card: 24px;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-display: 'Playfair Display', Georgia, serif;
    }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      font-family: var(--font-sans);
      font-size: 16px;
      color: var(--ink);
      background-color: var(--white-soft);
      padding: 32px 20px 60px;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- FUNDO ---------- */
    .bg-layer {
      position: fixed; inset: 0; z-index: -1; overflow: hidden;
      background:
        radial-gradient(1200px 600px at 15% 10%, #ffffff 0%, transparent 60%),
        radial-gradient(900px 500px at 85% 90%, var(--azul-bebe-50) 0%, transparent 55%),
        linear-gradient(160deg, #ffffff 0%, var(--azul-bebe-50) 55%, #eaf5fb 100%);
    }
    .bg-glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55; pointer-events: none; }
    .bg-glow-1 { width: 480px; height: 480px; top: -160px; left: -140px; background: radial-gradient(circle, var(--azul-bebe-200) 0%, transparent 70%); animation: float 14s ease-in-out infinite; }
    .bg-glow-2 { width: 560px; height: 560px; bottom: -220px; right: -160px; background: radial-gradient(circle, var(--azul-bebe-100) 0%, transparent 70%); animation: float 18s ease-in-out infinite reverse; }
    .bg-grain { position: absolute; inset: 0; background-image: radial-gradient(rgba(21, 101, 192, 0.05) 1px, transparent 1px); background-size: 22px 22px; mask-image: radial-gradient(circle at center, black 40%, transparent 80%); -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%); opacity: 0.6; }
    @keyframes float { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(20px, -20px) scale(1.05); } }

    .container {
      width: 100%; max-width: 1180px; margin: 0 auto;
      display: flex; flex-direction: column; gap: 24px;
      animation: fade-in 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes fade-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* ---------- TOPBAR ---------- */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap; padding: 18px 24px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-card); box-shadow: var(--shadow-md);
    }
    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .brand-logo {
      width: 46px; height: 46px; border-radius: 12px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--azul-escuro), var(--azul-escuro-2));
      color: var(--white); font-family: var(--font-display);
      font-weight: 700; font-size: 1.15rem; flex-shrink: 0;
      box-shadow: 0 8px 20px -6px rgba(21, 101, 192, 0.55);
    }
    .brand-info { min-width: 0; }
    .brand-info .top { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--azul-escuro); opacity: 0.85; }
    .brand-info .main { font-size: 0.95rem; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .user-chip {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 6px 14px 6px 6px;
      background: var(--azul-bebe-50); border: 1px solid var(--azul-bebe-100);
      border-radius: 999px;
    }
    .user-chip .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--azul-escuro), var(--azul-escuro-2));
      color: var(--white); font-size: 0.85rem; font-weight: 700; position: relative;
    }
    .user-chip .avatar::after {
      content: ""; position: absolute; bottom: -1px; right: -1px;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--verde); border: 2px solid var(--white);
    }
    .user-chip .name { font-size: 0.85rem; font-weight: 600; color: var(--ink); max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .btn-logout {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 16px; background: var(--white);
      border: 1px solid var(--azul-bebe-100); border-radius: 999px;
      color: var(--vermelho); font-family: inherit; font-size: 0.82rem;
      font-weight: 600; cursor: pointer; text-decoration: none;
      transition: all 0.3s ease;
    }
    .btn-logout:hover { background: var(--vermelho); color: var(--white); border-color: var(--vermelho); }
    .btn-logout svg { width: 15px; height: 15px; }

    /* ---------- HERO ---------- */
    .hero {
      padding: 36px 32px;
      background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(234,245,251,0.85));
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-md);
      position: relative; overflow: hidden;
    }
    .hero::before {
      content: ""; position: absolute; top: -40%; right: -10%;
      width: 380px; height: 380px; border-radius: 50%;
      background: radial-gradient(circle, rgba(184, 224, 245, 0.5), transparent 70%);
      pointer-events: none;
    }
    .hero-content { position: relative; z-index: 1; }
    .hero .eyebrow {
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--azul-escuro);
      margin-bottom: 6px;
    }
    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.3rem);
      font-weight: 700; line-height: 1.15;
      letter-spacing: -0.01em; color: var(--ink);
      margin-bottom: 8px;
    }
    .hero p {
      font-size: 0.95rem; color: var(--ink-soft);
      max-width: 620px; line-height: 1.5;
    }

    /* ---------- FILTROS ---------- */
    .filters {
      display: flex; align-items: center; gap: 12px;
      flex-wrap: wrap;
      padding: 12px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
    }
    .search {
      position: relative; flex: 1; min-width: 220px;
    }
    .search svg {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      width: 17px; height: 17px; color: var(--ink-mute); pointer-events: none;
    }
    .search input {
      width: 100%; padding: 12px 16px 12px 44px;
      font-family: inherit; font-size: 0.9rem;
      background: var(--white);
      border: 1.5px solid var(--azul-bebe-100);
      border-radius: 999px; outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .search input:focus { border-color: var(--azul-escuro); box-shadow: var(--ring); }

    .chip-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      padding: 8px 16px;
      background: var(--white);
      border: 1.5px solid var(--azul-bebe-100);
      border-radius: 999px;
      font-family: inherit; font-size: 0.8rem; font-weight: 600;
      color: var(--ink-soft); cursor: pointer;
      transition: all 0.25s ease;
    }
    .chip:hover { color: var(--azul-escuro); border-color: var(--azul-bebe-300); }
    .chip.active {
      background: var(--azul-escuro); color: var(--white);
      border-color: var(--azul-escuro);
      box-shadow: 0 6px 14px -4px rgba(21, 101, 192, 0.5);
    }

    /* ---------- GRID DE TURMAS ---------- */
    .turmas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }

    .turma-card {
      display: flex; flex-direction: column;
      padding: 22px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      text-decoration: none; color: inherit;
      position: relative; overflow: hidden;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.35s ease,
                  border-color 0.35s ease;
    }
    .turma-card::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(21, 101, 192, 0.04), transparent 60%);
      opacity: 0; transition: opacity 0.35s ease;
      pointer-events: none;
    }
    .turma-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
      border-color: var(--azul-bebe-200);
    }
    .turma-card:hover::after { opacity: 1; }

    .turma-top {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 18px;
      position: relative; z-index: 1;
    }
    .turma-avatar {
      width: 58px; height: 58px; border-radius: 16px;
      display: grid; place-items: center;
      color: var(--white);
      font-family: var(--font-display);
      font-size: 1.25rem; font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 10px 24px -8px rgba(21, 101, 192, 0.5);
    }
    .turma-avatar.c1 { background: linear-gradient(135deg, #1565c0, #0d47a1); }
    .turma-avatar.c2 { background: linear-gradient(135deg, #22c55e, #15803d); }
    .turma-avatar.c3 { background: linear-gradient(135deg, #f59e0b, #b45309); }
    .turma-avatar.c4 { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .turma-avatar.c5 { background: linear-gradient(135deg, #06b6d4, #0e7490); }
    .turma-avatar.c6 { background: linear-gradient(135deg, #ec4899, #be185d); }

    .turma-info { flex: 1; min-width: 0; }
    .turma-info .serie {
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--azul-escuro); opacity: 0.85;
      margin-bottom: 2px;
    }
    .turma-info .nome {
      font-family: var(--font-display);
      font-size: 1.25rem; font-weight: 700;
      color: var(--ink); line-height: 1.2;
      letter-spacing: -0.01em;
    }
    .turma-info .disc {
      font-size: 0.82rem; color: var(--ink-soft);
      margin-top: 2px;
    }

    .turma-stats {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 14px 0;
      margin: 0 0 16px;
      border-top: 1px solid var(--azul-bebe-100);
      border-bottom: 1px solid var(--azul-bebe-100);
      position: relative; z-index: 1;
    }
    .turma-stat { text-align: center; }
    .turma-stat-value {
      font-family: var(--font-display);
      font-size: 1.15rem; font-weight: 700;
      color: var(--ink); line-height: 1;
      margin-bottom: 4px;
    }
    .turma-stat-value.green { color: var(--verde); }
    .turma-stat-value.amber { color: var(--amarelo); }
    .turma-stat-value.red { color: var(--vermelho); }
    .turma-stat-label {
      font-size: 0.65rem; font-weight: 600;
      letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--ink-soft);
    }

    .turma-schedule {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.78rem; color: var(--ink-soft);
      margin-bottom: 16px;
      position: relative; z-index: 1;
    }
    .turma-schedule svg { width: 14px; height: 14px; color: var(--azul-escuro); flex-shrink: 0; }
    .turma-schedule .days {
      display: inline-flex; gap: 4px; margin-left: auto;
    }
    .turma-schedule .day {
      padding: 2px 8px; border-radius: 6px;
      background: var(--azul-bebe-50);
      color: var(--azul-escuro);
      font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.05em;
    }

    .turma-footer {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px;
      position: relative; z-index: 1;
    }
    .turma-status {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 999px;
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.03em;
    }
    .turma-status::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
    }
    .turma-status.ok { background: #dcfce7; color: #15803d; }
    .turma-status.atencao { background: #fef3c7; color: #b45309; }

    .turma-open {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.8rem; font-weight: 700;
      color: var(--azul-escuro);
      transition: gap 0.3s ease;
    }
    .turma-card:hover .turma-open { gap: 10px; }
    .turma-open svg { width: 14px; height: 14px; }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--ink-soft);
      background: rgba(255, 255, 255, 0.7);
      border: 1px dashed var(--azul-bebe-200);
      border-radius: 20px;
    }
    .empty-state svg {
      width: 48px; height: 48px; color: var(--azul-bebe-300);
      margin-bottom: 12px;
    }
    .empty-state p { font-size: 0.92rem; }

    /* ---------- RODAPÉ ---------- */
    .footer {
      margin-top: 12px; display: flex; align-items: center; justify-content: center;
      gap: 10px; padding: 20px 24px;
      background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 18px;
      box-shadow: var(--shadow-sm);
    }
    .footer .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--azul-escuro); opacity: 0.6; }
    .footer p { font-size: 0.76rem; color: var(--ink-soft); text-align: center; }

    /* ---------- RESPONSIVO ---------- */
    @media (max-width: 640px) {
      body { padding: 20px 14px 40px; }
      .topbar { padding: 14px 16px; }
      .hero { padding: 24px 20px; }
      .hero h1 { font-size: 1.5rem; }
      .user-chip .name { max-width: 100px; }
      .turmas-grid { grid-template-columns: 1fr; gap: 14px; }
      .turma-card { padding: 18px; }
      .turma-avatar { width: 52px; height: 52px; font-size: 1.1rem; border-radius: 14px; }
    }
    @media (max-width: 380px) {
      .user-chip .name { display: none; }
      .turma-stats { gap: 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="bg-layer" aria-hidden="true">
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-grain"></div>
  </div>

  <div class="container">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">FG</div>
        <div class="brand-info">
          <div class="top">Painel Docente</div>
          <div class="main">Frei Graciano Droessler</div>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="user-chip">
          <div class="avatar" id="user-avatar">P</div>
          <span class="name" id="user-name">Professor(a)</span>
        </div>
        <button class="btn-logout" id="btn-logout" title="Sair da conta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <path d="M16 17l5-5-5-5"/>
            <path d="M21 12H9"/>
          </svg>
          Sair
        </button>
      </div>
    </header>

    <!-- HERO -->
    <section class="hero">
      <div class="hero-content">
        <div class="eyebrow">Bem-vindo(a) de volta</div>
        <h1 id="hero-title">Minhas Turmas</h1>
        <p id="hero-sub">Selecione uma turma para visualizar alunos, notas, frequência e atividades.</p>
      </div>
    </section>

    <!-- FILTROS -->
    <section class="filters">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" id="busca" placeholder="Buscar turma, série ou disciplina..." />
      </div>
      <div class="chip-group" id="chips">
        <button class="chip active" data-filter="todas">Todas</button>
        <button class="chip" data-filter="manha">Manhã</button>
        <button class="chip" data-filter="tarde">Tarde</button>
        <button class="chip" data-filter="fundamental">Fundamental</button>
        <button class="chip" data-filter="medio">Médio</button>
      </div>
    </section>

    <!-- GRID -->
    <section class="turmas-grid" id="turmas-grid" aria-label="Lista de turmas"></section>

    <!-- RODAPÉ -->
    <footer class="footer">
      <span class="dot" aria-hidden="true"></span>
      <p>© 2025 · Escola Estadual do Campo Frei Graciano Droessler</p>
    </footer>

  </div>

        status: 'atencao'
      },
      {
        id: '3em-mat',
        sigla: '3M',
        serie: '3ª Série',
        nome: '3ª Série EM',
        disciplina: 'Matemática',
        periodo: 'manha',
        nivel: 'medio',
        turno: '09:20 às 11:00',
        dias: ['TER', 'QUI'],
        alunos: 26,
        media: 8.3,
        freq: 96,
        cor: 'c6',
        status: 'ok'
      }
    ];

    /* ---------- Render ---------- */
    const grid = document.getElementById('turmas-grid');
    let filtroAtual = 'todas';
    let buscaAtual  = '';

    function renderTurmas() {
      const termo = buscaAtual.toLowerCase().trim();

      const lista = turmas.filter(t => {
        // Filtro por chip
        if (filtroAtual === 'manha' || filtroAtual === 'tarde') {
          if (t.periodo !== filtroAtual) return false;
        } else if (filtroAtual === 'fundamental' || filtroAtual === 'medio') {
          if (t.nivel !== filtroAtual) return false;
        }
        // Busca
        if (termo) {
          const haystack = (t.nome + ' ' + t.disciplina + ' ' + t.serie).toLowerCase();
          if (!haystack.includes(termo)) return false;
        }
        return true;
      });

      if (lista.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <path d="M21 21l-4.35-4.35"/>
            </svg>
            <p>Nenhuma turma encontrada com esses filtros.</p>
          </div>`;
        return;
      }

      grid.innerHTML = lista.map(t => {
        const statusLabel = t.status === 'ok' ? 'Em dia' : 'Atenção';
        const freqClass = t.freq >= 90 ? 'green' : t.freq >= 80 ? 'amber' : 'red';
        const mediaClass = t.media >= 7 ? 'green' : t.media >= 6 ? 'amber' : 'red';

        return `
          <a class="turma-card" href="detalhes-turma.html?id=${t.id}" data-id="${t.id}">
            <div class="turma-top">
              <div class="turma-avatar ${t.cor}">${t.sigla}</div>
              <div class="turma-info">
                <div class="serie">${t.serie}</div>
                <div class="nome">${t.nome}</div>
                <div class="disc">${t.disciplina}</div>
              </div>
            </div>

            <div class="turma-stats">
              <div class="turma-stat">
                <div class="turma-stat-value">${t.alunos}</div>
                <div class="turma-stat-label">Alunos</div>
              </div>
              <div class="turma-stat">
                <div class="turma-stat-value ${mediaClass}">${t.media.toFixed(1)}</div>
                <div class="turma-stat-label">Média</div>
              </div>
              <div class="turma-stat">
                <div class="turma-stat-value ${freqClass}">${t.freq}%</div>
                <div class="turma-stat-label">Frequência</div>
              </div>
            </div>

            <div class="turma-schedule">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 6v6l4 2"/>
              </svg>
              ${t.turno}
              <span class="days">
                ${t.dias.map(d => `<span class="day">${d}</span>`).join('')}
              </span>
            </div>

            <div class="turma-footer">
              <span class="turma-status ${t.status}">${statusLabel}</span>
              <span class="turma-open">
                Abrir turma
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 12h14"/>
                  <path d="M12 5l7 7-7 7"/>
                </svg>
              </span>
            </div>
          </a>`;
      }).join('');
    }

    renderTurmas();

    /* ---------- Eventos ---------- */
    document.getElementById('busca').addEventListener('input', e => {
      buscaAtual = e.target.value;
      renderTurmas();
    });

    document.querySelectorAll('#chips .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('#chips .chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        filtroAtual = chip.dataset.filter;
        renderTurmas();
      });
    });
  </script>

</body>
</html>
