<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#8b5cf6" />
  <title>Ficha do Conselho de Classe · Frei Graciano Droessler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #ffffff;
      --white-soft: #f7fbfe;
      --azul-bebe-50: #eaf5fb;
      --azul-bebe-100: #d3ecf8;
      --azul-bebe-200: #b8e0f5;
      --azul-bebe-300: #8ecbee;
      --azul-escuro: #1565c0;
      --azul-escuro-2: #0d47a1;
      --ink: #0f1e35;
      --ink-soft: #475569;
      --ink-mute: #94a3b8;
      --verde: #22c55e;
      --amarelo: #f59e0b;
      --vermelho: #dc2626;
      --roxo: #8b5cf6;
      --roxo-2: #6d28d9;
      --shadow-sm: 0 1px 2px rgba(15, 30, 53, 0.06);
      --shadow-md: 0 10px 30px -10px rgba(21, 101, 192, 0.18);
      --shadow-lg: 0 30px 60px -20px rgba(21, 101, 192, 0.25);
      --ring-roxo: 0 0 0 4px rgba(139, 92, 246, 0.2);
      --radius-card: 24px;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-display: 'Playfair Display', Georgia, serif;
    }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      font-family: var(--font-sans);
      font-size: 16px;
      color: var(--ink);
      background-color: var(--white-soft);
      padding: 32px 20px 60px;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- FUNDO ---------- */
    .bg-layer {
      position: fixed; inset: 0; z-index: -1; overflow: hidden;
      background:
        radial-gradient(1200px 600px at 15% 10%, #ffffff 0%, transparent 60%),
        radial-gradient(900px 500px at 85% 90%, #f3ecfd 0%, transparent 55%),
        linear-gradient(160deg, #ffffff 0%, #f3ecfd 55%, #eaf5fb 100%);
    }
    .bg-glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55; pointer-events: none; }
    .bg-glow-1 { width: 480px; height: 480px; top: -160px; left: -140px; background: radial-gradient(circle, var(--azul-bebe-200) 0%, transparent 70%); animation: float 14s ease-in-out infinite; }
    .bg-glow-2 { width: 560px; height: 560px; bottom: -220px; right: -160px; background: radial-gradient(circle, rgba(139, 92, 246, 0.35) 0%, transparent 70%); animation: float 18s ease-in-out infinite reverse; }
    .bg-grain { position: absolute; inset: 0; background-image: radial-gradient(rgba(139, 92, 246, 0.05) 1px, transparent 1px); background-size: 22px 22px; mask-image: radial-gradient(circle at center, black 40%, transparent 80%); -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%); opacity: 0.6; }
    @keyframes float { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(20px, -20px) scale(1.05); } }

    .container {
      width: 100%; max-width: 980px; margin: 0 auto;
      display: flex; flex-direction: column; gap: 20px;
      animation: fade-in 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes fade-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* ---------- TOPBAR ---------- */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap; padding: 16px 22px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-card); box-shadow: var(--shadow-md);
    }
    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .brand-logo {
      width: 44px; height: 44px; border-radius: 12px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--roxo), var(--roxo-2));
      color: var(--white); font-family: var(--font-display);
      font-weight: 700; font-size: 1.1rem; flex-shrink: 0;
      box-shadow: 0 8px 20px -6px rgba(139, 92, 246, 0.6);
    }
    .brand-info { min-width: 0; }
    .brand-info .top { font-size: 0.66rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--roxo); opacity: 0.9; }
    .brand-info .main { font-size: 0.92rem; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 10px 16px; border-radius: 999px;
      font-family: inherit; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; text-decoration: none; border: none;
      transition: all 0.25s ease;
    }
    .btn svg { width: 15px; height: 15px; }
    .btn-ghost {
      background: var(--white); color: var(--roxo);
      border: 1px solid rgba(139, 92, 246, 0.25);
    }
    .btn-ghost:hover { background: var(--roxo); color: var(--white); border-color: var(--roxo); }
    .btn-primary {
      background: linear-gradient(135deg, var(--roxo), var(--roxo-2));
      color: var(--white);
      box-shadow: 0 8px 20px -6px rgba(139, 92, 246, 0.6);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 26px -6px rgba(139, 92, 246, 0.7); }
    .btn-success {
      background: linear-gradient(135deg, var(--verde), #15803d);
      color: var(--white);
      box-shadow: 0 8px 20px -6px rgba(34, 197, 94, 0.5);
    }
    .btn-success:hover { transform: translateY(-2px); box-shadow: 0 12px 26px -6px rgba(34, 197, 94, 0.6); }

    /* ---------- FOLHA (documento) ---------- */
    .ficha {
      background: var(--white);
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      padding: 48px 56px;
      position: relative;
      overflow: hidden;
    }
    .ficha::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--roxo), var(--azul-escuro));
    }

    /* Cabeçalho do documento */
    .doc-header {
      text-align: center;
      padding-bottom: 24px;
      border-bottom: 2px solid var(--azul-bebe-100);
      margin-bottom: 28px;
    }
    .doc-header .escola {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--roxo);
      margin-bottom: 8px;
    }
    .doc-header h1 {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      font-weight: 700; color: var(--ink);
      letter-spacing: -0.01em; margin-bottom: 6px;
    }
    .doc-header .sub {
      font-size: 0.85rem; color: var(--ink-soft);
    }

    /* Bloco */
    .bloco { margin-bottom: 28px; }
    .bloco-title {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-display);
      font-size: 1.05rem; font-weight: 700;
      color: var(--ink);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1.5px solid var(--azul-bebe-100);
    }
    .bloco-title .num {
      width: 26px; height: 26px; border-radius: 8px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--roxo), var(--roxo-2));
      color: var(--white);
      font-family: var(--font-sans);
      font-size: 0.82rem; font-weight: 700;
      flex-shrink: 0;
    }

    /* Identificação (grid de campos) */
    .ident-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 20px;
    }
    .ident-grid .full { grid-column: 1 / -1; }

    .field {
      display: flex; flex-direction: column; gap: 6px;
    }
    .field label {
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--ink-soft);
    }
    .field input[type="text"],
    .field input[type="date"] {
      padding: 10px 14px;
      font-family: inherit; font-size: 0.92rem;
      color: var(--ink);
      background: var(--white);
      border: none;
      border-bottom: 1.5px solid var(--azul-bebe-200);
      border-radius: 0;
      outline: none;
      transition: border-color 0.25s ease;
    }
    .field input:focus {
      border-bottom-color: var(--roxo);
    }
    .field input::placeholder { color: var(--ink-mute); }

    /* Perguntas + textarea */
    .pergunta {
      margin-bottom: 16px;
    }
    .pergunta .q {
      font-size: 0.88rem; font-weight: 600;
      color: var(--ink); line-height: 1.4;
      margin-bottom: 8px;
      display: flex; gap: 8px;
    }
    .pergunta .q::before {
      content: "▸";
      color: var(--roxo);
      font-weight: 700;
      flex-shrink: 0;
    }
    .pergunta textarea {
      width: 100%;
      min-height: 90px;
      padding: 12px 14px;
      font-family: inherit; font-size: 0.9rem; line-height: 1.55;
      color: var(--ink);
      background: var(--white);
      border: 1.5px solid var(--azul-bebe-100);
      border-radius: 12px;
      outline: none;
      resize: vertical;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .pergunta textarea:focus {
      border-color: var(--roxo);
      box-shadow: var(--ring-roxo);
    }
    .pergunta textarea::placeholder {
      color: var(--ink-mute);
      font-style: italic;
    }

    /* Lista de destaques */
    .list-box {
      display: flex; flex-direction: column; gap: 8px;
    }
    .list-row {
      display: flex; align-items: flex-start; gap: 10px;
    }
    .list-row .bullet {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--roxo);
      margin-top: 14px;
      flex-shrink: 0;
    }
    .list-row.danger .bullet { background: var(--vermelho); }
    .list-row.warn .bullet { background: var(--amarelo); }
    .list-row.ok .bullet { background: var(--verde); }
    .list-row input {
      flex: 1;
      padding: 10px 14px;
      font-family: inherit; font-size: 0.9rem;
      color: var(--ink);
      background: var(--white);
      border: none;
      border-bottom: 1.5px solid var(--azul-bebe-200);
      outline: none;
      transition: border-color 0.25s ease;
    }
    .list-row input:focus { border-bottom-color: var(--roxo); }
    .list-row input::placeholder { color: var(--ink-mute); font-style: italic; }

    /* Síntese do professor (texto grande) */
    .sintese textarea {
      width: 100%;
      min-height: 140px;
      padding: 16px;
      font-family: var(--font-display);
      font-size: 1rem; line-height: 1.6;
      color: var(--ink);
      background: linear-gradient(135deg, #faf5ff, #f3ecfd);
      border: 1.5px solid rgba(139, 92, 246, 0.25);
      border-radius: 14px;
      outline: none;
      resize: vertical;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .sintese textarea:focus {
      border-color: var(--roxo);
      box-shadow: var(--ring-roxo);
    }

    /* Assinaturas */
    .assinaturas {
      margin-top: 40px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
    }
    .assinatura {
      text-align: center;
    }
    .assinatura .linha {
      border-top: 1.5px solid var(--ink);
      padding-top: 8px;
      margin-top: 40px;
    }
    .assinatura .cargo {
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--ink-soft);
    }

    /* Rodapé do documento */
    .doc-footer {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1.5px solid var(--azul-bebe-100);
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px;
      font-size: 0.75rem; color: var(--ink-soft);
    }
    .doc-footer .local {
      display: inline-flex; align-items: center; gap: 6px;
    }

    /* ---------- ESTADO VAZIO ---------- */
    .empty-full {
      min-height: 50vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; gap: 16px;
      padding: 60px 24px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-md);
    }
    .empty-full svg { width: 56px; height: 56px; color: rgba(139, 92, 246, 0.4); }
    .empty-full h2 { font-family: var(--font-display); font-size: 1.5rem; color: var(--ink); }
    .empty-full p { color: var(--ink-soft); max-width: 420px; font-size: 0.92rem; }

    /* ---------- TOAST ---------- */
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translate(-50%, 100px);
      padding: 14px 24px;
      background: linear-gradient(135deg, var(--roxo), var(--roxo-2));
      color: var(--white);
      border-radius: 999px;
      font-size: 0.85rem; font-weight: 600;
      box-shadow: 0 20px 40px -10px rgba(139, 92, 246, 0.6);
      z-index: 2000;
      display: inline-flex; align-items: center; gap: 10px;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
      pointer-events: none;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .toast svg { width: 18px; height: 18px; }

    /* ---------- RESPONSIVO ---------- */
    @media (max-width: 640px) {
      body { padding: 20px 12px 40px; }
      .ficha { padding: 28px 22px; }
      .ident-grid { grid-template-columns: 1fr; }
      .assinaturas { grid-template-columns: 1fr; gap: 20px; }
      .assinatura .linha { margin-top: 30px; }
      .topbar { padding: 14px 16px; }
      .doc-footer { justify-content: center; text-align: center; }
    }

    /* ---------- PRINT ---------- */
    @media print {
      body {
        background: white !important;
        padding: 0;
        font-size: 11pt;
      }
      .bg-layer,
      .topbar,
      .no-print {
        display: none !important;
      }
      .container { max-width: 100%; gap: 0; }
      .ficha {
        box-shadow: none;
        border-radius: 0;
        padding: 0;
      }
      .ficha::before { display: none; }
      .bloco { page-break-inside: avoid; }
      .assinaturas { page-break-inside: avoid; }
      textarea, input {
        border-color: #ccc !important;
        background: white !important;
      }
      .sintese textarea {
        background: white !important;
      }
      .bloco-title .num {
        background: #8b5cf6 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="bg-layer" aria-hidden="true">
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-grain"></div>
  </div>

  <div class="container">

    <!-- TOPBAR (não imprime) -->
    <header class="topbar no-print">
      <div class="brand">
        <div class="brand-logo">CC</div>
        <div class="brand-info">
          <div class="top">Painel Docente</div>
          <div class="main">Ficha do Conselho de Classe</div>
        </div>
      </div>
      <div class="topbar-actions">
        <a href="turmas.html" class="btn btn-ghost" id="btn-voltar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"/>
            <path d="M12 19l-7-7 7-7"/>
          </svg>
          Voltar
        </a>
        <button class="btn btn-ghost" onclick="window.print()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9V2h12v7"/>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <rect x="6" y="14" width="12" height="8"/>
          </svg>
          Imprimir
        </button>
        <button class="btn btn-success" id="btn-salvar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
          Salvar Ficha
        </button>
      </div>
    </header>

    <!-- CONTEÚDO (preenchido via JS) -->
    <div id="conteudo"></div>

  </div>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6L9 17l-5-5"/>
    </svg>
    <span id="toast-text">Salvo</span>
  </div>

  <script>
    /* =========================================================
       PROTEÇÃO
       ========================================================= */
    const nomeProfessor = sessionStorage.getItem('professorLogado');
    if (!nomeProfessor) window.location.href = 'professor.html';

    /* =========================================================
       LÊ A TURMA DO localStorage (?turma=)
       ========================================================= */
    const STORAGE_TURMAS = 'turmasProfessor';
    const STORAGE_FICHAS = 'fichasConselho';

    const params = new URLSearchParams(window.location.search);
    const turmaId = params.get('turma');

    let turmaAtual = null;
    try {
      const lista = JSON.parse(localStorage.getItem(STORAGE_TURMAS) || '[]');
      turmaAtual = lista.find(t => t.id === turmaId) || null;
    } catch (e) {
      console.error('Erro ao ler turmas:', e);
    }

    const conteudo = document.getElementById('conteudo');
    const btnVoltar = document.getElementById('btn-voltar');

    // Se veio sem turma, ainda assim mostra a ficha (em branco)
    if (turmaAtual) {
      btnVoltar.href = `turma-detalhes.html?id=${encodeURIComponent(turmaAtual.id)}`;
      document.title = `Ficha do Conselho · ${turmaAtual.nome} · Frei Graciano Droessler`;
    } else {
      btnVoltar.href = 'turmas.html';
    }

    /* =========================================================
       CARREGA FICHA SALVA (se existir)
       ========================================================= */
    let fichaSalva = {};
    try {
      const all = JSON.parse(localStorage.getItem(STORAGE_FICHAS) || '{}');
      fichaSalva = (turmaId && all[turmaId]) ? all[turmaId] : {};
    } catch (e) { console.error(e); }

    /* =========================================================
       DADOS INICIAIS
       ========================================================= */
    const dadosIniciais = {
      professor: nomeProfessor || '',
      componente: turmaAtual ? turmaAtual.disciplina : '',
      turma: turmaAtual ? turmaAtual.nome : '',
      data: new Date().toISOString().slice(0, 10),

      // 1. Panorama
      panoramaAprendizagem: '',
      panoramaParticipacao: '',

      // 2. Aprendizagem e Frequência
      dificuldades: '',
      baixaFrequencia: '',

      // 3. Destaques
      destaquesPositivos: '',
      destaquesDificuldades: '',

      // 4. Encaminhamentos
      estrategias: '',
      observacoesPreConselho: '',

      // 5. Síntese
      sintese: ''
    };

    // Mescla com o que já foi salvo
    const dados = { ...dadosIniciais, ...fichaSalva };

    /* =========================================================
       RENDER DA FICHA
       ========================================================= */
    function renderFicha() {
      const hoje = new Date();
      const dataFmt = hoje.toLocaleDateString('pt-BR', {
        day: '2-digit', month: 'long', year: 'numeric'
      });

      conteudo.innerHTML = `
        <article class="ficha" id="ficha-doc">

          <!-- CABEÇALHO DO DOCUMENTO -->
          <div class="doc-header">
            <div class="escola">Escola Estadual do Campo Frei Graciano Droessler</div>
            <h1>Ficha do Conselho de Classe</h1>
            <div class="sub">Registro pedagógico · ${dataFmt}</div>
          </div>

          <!-- IDENTIFICAÇÃO -->
          <section class="bloco">
            <div class="bloco-title">
              <span class="num">0</span>
              Identificação
            </div>
            <div class="ident-grid">
              <div class="field full">
                <label for="f-professor">Professor(a)</label>
                <input type="text" id="f-professor" value="${escapeAttr(dados.professor)}" placeholder="Nome do(a) professor(a)" />
              </div>
              <div class="field">
                <label for="f-componente">Componente (Disciplina)</label>
                <input type="text" id="f-componente" value="${escapeAttr(dados.componente)}" placeholder="Ex: Matemática" />
              </div>
              <div class="field">
                <label for="f-turma">Turma</label>
                <input type="text" id="f-turma" value="${escapeAttr(dados.turma)}" placeholder="Ex: 9º Ano A" />
              </div>
              <div class="field">
                <label for="f-data">Data</label>
                <input type="date" id="f-data" value="${escapeAttr(dados.data)}" />
              </div>
            </div>
          </section>

          <!-- 1. PANORAMA -->
          <section class="bloco">
            <div class="bloco-title">
              <span class="num">1</span>
              Panorama da Turma
            </div>

            <div class="pergunta">
              <div class="q">Como você avalia o desenvolvimento geral da turma em relação à aprendizagem?</div>
              <textarea id="f-panoramaAprendizagem" placeholder="Descreva o panorama geral da turma neste componente...">${escapeHtml(dados.panoramaAprendizagem)}</textarea>
            </div>

            <div class="pergunta">
              <div class="q">Como está a participação, o envolvimento e a postura dos estudantes nas aulas?</div>
              <textarea id="f-panoramaParticipacao" placeholder="Fale sobre engajamento, comportamento, frequência às aulas...">${escapeHtml(dados.panoramaParticipacao)}</textarea>
            </div>
          </section>

          <!-- 2. APRENDIZAGEM E FREQUÊNCIA -->
          <section class="bloco">
            <div class="bloco-title">
              <span class="num">2</span>
              Aprendizagem e Frequência
            </div>

            <div class="pergunta">
              <div class="q">Quais habilidades/conteúdos apresentam maior dificuldade para a turma?</div>
              <textarea id="f-dificuldades" placeholder="Liste os conteúdos ou habilidades em que a turma encontra maior dificuldade...">${escapeHtml(dados.dificuldades)}</textarea>
            </div>

            <div class="pergunta">
              <div class="q">Há estudantes com baixa frequência ou que necessitam de acompanhamento mais próximo? Quais e por quê?</div>
              <textarea id="f-baixaFrequencia" placeholder="Cite nomes e motive a necessidade de acompanhamento...">${escapeHtml(dados.baixaFrequencia)}</textarea>
            </div>
          </section>

          <!-- 3. DESTAQUES -->
          <section class="bloco">
            <div class="bloco-title">
              <span class="num">3</span>
              Destaques e Situações que Merecem Atenção
            </div>

            <div class="pergunta">
              <div class="q">Estudantes que se destacaram positivamente (aprendizagem, participação, responsabilidade ou protagonismo).</div>
              <div class="list-box" id="lista-positivos">
                ${renderListaItens('positivo', 'Nome do estudante + motivo do destaque')}
              </div>
              <button type="button" class="btn btn-ghost no-print" style="margin-top:10px" onclick="addItem('positivo')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 5v14M5 12h14"/>
                </svg>
                Adicionar destaque
              </button>
            </div>

            <div class="pergunta" style="margin-top:24px">
              <div class="q">Estudantes com dificuldades: alunos que apresentam dificuldades significativas ou que necessitam de intervenção/encaminhamento.</div>
              <div class="list-box" id="lista-dificuldades">
                ${renderListaItens('dificuldade', 'Nome do estudante + dificuldade/intervenção sugerida')}
              </div>
              <button type="button" class="btn btn-ghost no-print" style="margin-top:10px" onclick="addItem('dificuldade')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 5v14M5 12h14"/>
                </svg>
                Adicionar estudante
              </button>
            </div>
          </section>

          <!-- 4. ENCAMINHAMENTOS -->
          <section class="bloco">
            <div class="bloco-title">
              <span class="num">4</span>
              Encaminhamentos
            </div>

            <div class="pergunta">
              <div class="q">Quais estratégias já foram realizadas e quais ações você sugere para o próximo período?</div>
              <textarea id="f-estrategias" placeholder="Descreva o que já foi feito e o que pretende fazer...">${escapeHtml(dados.estrategias)}</textarea>
            </div>

            <div class="pergunta">
              <div class="q">Há alguma observação importante que deve ser registrada no Pré-Conselho?</div>
              <textarea id="f-observacoesPreConselho" placeholder="Registre aqui qualquer ponto que deva ser levado à discussão prévia...">${escapeHtml(dados.observacoesPreConselho)}</textarea>
            </div>
          </section>

          <!-- 5. SÍNTESE -->
          <section class="bloco">
            <div class="bloco-title">
              <span class="num">5</span>
              Síntese do Professor
            </div>

            <div class="pergunta sintese">
              <div class="q">Deixe aqui uma observação geral sobre a turma e/ou sobre algum estudante que considere relevante para o Conselho de Classe.</div>
              <textarea id="f-sintese" placeholder="Síntese final para o Conselho de Classe...">${escapeHtml(dados.sintese)}</textarea>
            </div>
          </section>

          <!-- ASSINATURAS -->
          <section class="assinaturas">
            <div class="assinatura">
              <div class="linha"></div>
              <div class="cargo">Professor(a)</div>
            </div>
            <div class="assinatura">
              <div class="linha"></div>
              <div class="cargo">Pedagoga(o)</div>
            </div>
            <div class="assinatura">
              <div class="linha"></div>
              <div class="cargo">Diretora(or)</div>
            </div>
          </section>

          <!-- RODAPÉ DO DOCUMENTO -->
          <footer class="doc-footer">
            <div class="local">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                <circle cx="12" cy="10" r="3"/>
              </svg>
              <span>Frei Graciano Droessler · ${dataFmt}</span>
            </div>
            <div>Documento gerado eletronicamente no Painel Docente</div>
          </footer>

        </article>
      `;

      // Carrega itens das listas salvas (ou inicia com 1 em branco)
      carregarLista('positivo', dados.destaquesPositivos);
      carregarLista('dificuldade', dados.destaquesDificuldades);

      // Bind dos campos para salvar automaticamente
      bindCampos();
    }

    /* ---------- Helpers ---------- */
    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }

    function renderListaItens(tipo, placeholder) {
      const cls = tipo === 'positivo' ? 'ok' : 'danger';
      return `
        <div class="list-row ${cls}" data-tipo="${tipo}">
          <span class="bullet"></span>
          <input type="text" placeholder="${placeholder}" />
        </div>
      `;
    }

    function addItem(tipo) {
      const lista = document.getElementById(tipo === 'positivo' ? 'lista-positivos' : 'lista-dificuldades');
      const cls = tipo === 'positivo' ? 'ok' : 'danger';
      const placeholder = tipo === 'positivo'
        ? 'Nome do estudante + motivo do destaque'
        : 'Nome do estudante + dificuldade/intervenção sugerida';

      const div = document.createElement('div');
      div.className = `list-row ${cls}`;
      div.dataset.tipo = tipo;
      div.innerHTML = `
        <span class="bullet"></span>
        <input type="text" placeholder="${placeholder}" />
      `;
      lista.appendChild(div);
      div.querySelector('input').focus();
    }

    function carregarLista(tipo, valores) {
      const container = document.getElementById(tipo === 'positivo' ? 'lista-positivos' : 'lista-dificuldades');
      const lista = Array.isArray(valores) && valores.length > 0 ? valores : [''];

      const cls = tipo === 'positivo' ? 'ok' : 'danger';
      const placeholder = tipo === 'positivo'
        ? 'Nome do estudante + motivo do destaque'
        : 'Nome do estudante + dificuldade/intervenção sugerida';

      container.innerHTML = lista.map(v => `
        <div class="list-row ${cls}" data-tipo="${tipo}">
          <span class="bullet"></span>
          <input type="text" placeholder="${placeholder}" value="${escapeAttr(v)}" />
        </div>
      `).join('');
    }

    function coletarLista(tipo) {
      const container = document.getElementById(tipo === 'positivo' ? 'lista-positivos' : 'lista-dificuldades');
      return Array.from(container.querySelectorAll('input'))
        .map(i => i.value.trim())
        .filter(v => v.length > 0);
    }

    /* =========================================================
       AUTO-SAVE (campos)
       ========================================================= */
    let saveTimeout = null;
    function agendarSave() {
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => salvarFicha(false), 1200);
    }

    function bindCampos() {
      const campos = [
        'f-professor', 'f-componente', 'f-turma', 'f-data',
        'f-panoramaAprendizagem', 'f-panoramaParticipacao',
        'f-dificuldades', 'f-baixaFrequencia',
        'f-estrategias', 'f-observacoesPreConselho',
        'f-sintese'
      ];
      campos.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', agendarSave);
      });

      // Inputs das listas
      document.querySelectorAll('.list-row input').forEach(inp => {
        inp.addEventListener('input', agendarSave);
      });
    }

    /* =========================================================
       SALVAR
       ========================================================= */
    function salvarFicha(mostrarToast = true) {
      const ficha = {
        professor: document.getElementById('f-professor').value.trim(),
        componente: document.getElementById('f-componente').value.trim(),
        turma: document.getElementById('f-turma').value.trim(),
        data: document.getElementById('f-data').value,

        panoramaAprendizagem: document.getElementById('f-panoramaAprendizagem').value,
        panoramaParticipacao: document.getElementById('f-panoramaParticipacao').value,

        dificuldades: document.getElementById('f-dificuldades').value,
        baixaFrequencia: document.getElementById('f-baixaFrequencia').value,

        destaquesPositivos: coletarLista('positivo'),
        destaquesDificuldades: coletarLista('dificuldade'),

        estrategias: document.getElementById('f-estrategias').value,
        observacoesPreConselho: document.getElementById('f-observacoesPreConselho').value,

        sintese: document.getElementById('f-sintese').value,

        atualizadoEm: new Date().toISOString()
      };

      try {
        const chave = turmaId || 'sem-turma';
        const all = JSON.parse(localStorage.getItem(STORAGE_FICHAS) || '{}');
        all[chave] = ficha;
        localStorage.setItem(STORAGE_FICHAS, JSON.stringify(all));
        if (mostrarToast) mostrarToast('Ficha salva com sucesso!');
      } catch (e) {
        console.error('Erro ao salvar:', e);
        alert('Erro ao salvar. Tente novamente.');
      }
    }

    /* =========================================================
       TOAST
       ========================================================= */
    const toastEl = document.getElementById('toast');
    const toastText = document.getElementById('toast-text');
    let toastTimeout = null;
    function mostrarToast(msg) {
      toastText.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 2600);
    }

    /* =========================================================
       INICIALIZA
       ========================================================= */
    renderFicha();
    document.getElementById('btn-salvar').addEventListener('click', () => salvarFicha(true));
  </script>

</body>
</html>
